    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version：transitive（IDNA/unicode 链），无安全升级；稳定只读表格" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident：transitive（IDNA/unicode 链），无安全升级；稳定只读表格" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile：transitive（TLS 链），无安全升级；仅解析本地 PEM" },
    { id = "RUSTSEC-2025-0141", reason = "bincode：transitive（Tauri IPC 序列化），无安全升级；仅本机进程间数据" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr：transitive（markup/HTML 链），无安全升级；只读解析" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps：transitive（im 不可变容器链），无安全升级；只读内存容器" },
