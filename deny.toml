# cargo-deny configuration for Conex / Crish
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # Explicitly permitted crates with dual or custom permissive licenses
    # 0BSD（OSI 认可，比 MIT 更宽松、无署名义务）只对实际用到它的 crate 放行，不进全局 allow：
    # 二者都是 interprocess 2.4（经 tauri-plugin-mcp）引入的传递依赖。新出现 0BSD crate 时须在此逐个登记。
    { crate = "doctest-file", allow = ["0BSD"] },
    { crate = "recvmsg", allow = ["0BSD"] },
]

# tauri-plugin-mcp 为 git 依赖，其 npm 声明 package.json 为 MIT，但 Cargo.toml 遗漏 license 字段。
# 依据 cargo-deny 官方规范通过 clarify 精确补充真实许可证（MIT），不放宽 unlicensed 安全检查。
[[licenses.clarify]]
name = "tauri-plugin-mcp"
expression = "MIT"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    "https://github.com/P3GLEG/tauri-plugin-mcp",
]

[advisories]
# cargo-deny 0.18+ 的 v2 格式：vulnerability / unsound 恒为 error，`notice` 已移除，
# `unmaintained` 取作用域（all/workspace/transitive/none）。取最严格的 "all"：
# 无维护依赖逐条处理（升级/替换），确实无法替换的才在 ignore 中带理由与复查日期登记。
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # ── 无维护传递依赖（复查日期 2026-10-28；下次复核 2027-01-31）──
    # 均为上游传递依赖且 advisory 明确 "No safe upgrade is available"；
    # 运行期仅消费其稳定 API，不处理不可信输入。解除条件：上游替换/归档移除。
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust：transitive（配置解析链），无安全升级；仅本地 YAML" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error：transitive 构建期宏依赖，无安全升级；不进运行时" },
    { id = "RUSTSEC-2024-0436", reason = "paste：transitive 构建期宏依赖，无安全升级；不进运行时" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml：transitive（yaml-rust 底层），无安全升级；仅本地 YAML" },
