[package]
name = "crish-agent-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# 模型字典真源（models.yaml）解析/校验：models_yaml.rs 唯一解析路径
serde_yaml = "0.9"
# protocol-asset：文件管理器图片/PDF 预览（convertFileSrc + asset://）；
# test：壳测试（tauri::test 依赖，PE-11 测试策略）
tauri = { workspace = true, features = ["protocol-asset", "test"] }
tauri-plugin-dialog = "2"
# G-2 单实例锁（R1-09）：官方插件。Windows 内部为命名互斥（CreateMutexW +
# ERROR_ALREADY_EXISTS，互斥名 `{identifier}-sim`），第二实例经 WM_COPYDATA
# 唤醒首实例后自行退出；注册/回调接线见 src/single_instance.rs
tauri-plugin-single-instance = "2"
# Dev MCP bridge (Grok/Cursor 调试 live workbench)。仅 debug 注册；插件自身 release 默认不启 socket。
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
url = "2"
reqwest.workspace = true
# 本地服务化（D2 §6.4 / R1-02）：axum 0.8 默认关 feature，显式开
# ws/json/http1/tokio（PE-10 登记：axum 全家一次登记；ws 实际使用留
# R1-05，ws feature 内层 tokio-tungstenite 已在锁文件被 conex-browser
# 消费，不新增版本）
axum = { version = "0.8", default-features = false, features = ["ws", "json", "http1", "tokio"] }
# 令牌 / 配对码 CSPRNG（D2 §7.3：rand 与 getrandom 二选一；getrandom 0.2
# 已在锁文件，直接声明复用，不新增锁文件条目）
getrandom = "0.2"
# 令牌哈希 / 配对码 hex 编码（workspace 已有声明）
hex.workspace = true

sha2 = "0.10"
base64 = "0.22"
chardetng = "0.1"
encoding_rs = "0.8"
memmap2 = "0.9"
tracing.workspace = true
async-trait.workspace = true
# trash 服务 API 契约（conex-fs::trash 返回 anyhow::Result）；G5 清理时 trash 未创建，
# S5 接线后恢复依赖
anyhow.workspace = true
conex-sandbox = { path = "../../../crates/conex-sandbox" }
conex-types = { path = "../../../crates/conex-types" }
conex-compaction = { path = "../../../crates/conex-compaction" }
conex-diff = { path = "../../../crates/conex-diff" }
conex-search = { path = "../../../crates/conex-search" }
conex-fs = { path = "../../../crates/conex-fs" }
conex-db = { path = "../../../crates/conex-db" }
conex-markdown = { path = "../../../crates/conex-markdown" }
dirs = "6"
# Round7：真实笔记后端（DocSession + workspace.db 投影；独立于 sessions.db）
conex-note-runtime = { path = "../../../crates/conex-note-runtime" }
# R 轮重写接线：事件存储 / 恢复快照（orchestrator）、会话循环与审批
# （session-loop）、provider 适配（agent-provider）、内置工具（agent-tools）、
# 结构化日志与崩溃文件（conex-telemetry）
orchestrator = { path = "../../../crates/orchestrator" }
session-loop = { path = "../../../crates/session-loop" }
agent-provider = { path = "../../../crates/agent-provider" }
agent-tools = { path = "../../../crates/agent-tools" }
conex-telemetry = { path = "../../../crates/conex-telemetry" }
# 27 接线方案 S3/S6：浏览器进程管理（conex-browser）+ 工具族/门禁（conex-browser-tools）
conex-browser = { path = "../../../crates/conex-browser" }
conex-browser-tools = { path = "../../../crates/conex-browser-tools" }
# 06 遗留⑨：电脑操作会话槽（ComputerSlot 守卫装配 + register_computer_tools 后置注册；
# 吞并幽灵引用补全时同步补回依赖，模块见 src/computer/mod.rs）
conex-computer = { path = "../../../crates/conex-computer" }
conex-computer-tools = { path = "../../../crates/conex-computer-tools" }
# Interactive terminal (Windows ConPTY / Unix PTY)
portable-pty = "0.9"
# 多端互通 R1-06（TLS + 自签证书 + 指纹固定，multi_device/tls.rs）：
# - rustls（ring provider，显式装配）与 reqwest 0.13 的 rustls-ring 同栈，不引入第二套 TLS 实现；
# - rcgen 自签 CA/叶子签发（默认 crypto+pem+ring；x509-parser 特性用于从磁盘还原 CA 续签叶子）；
# - tokio-rustls 提供 TlsAcceptor（server 骨架 R1-02 消费）；
# - rustls-pemfile 读取 PEM 证书/私钥（rustls 生态标准件，零传递依赖）；
# - time 构造证书有效期；x509-parser 提取 SPKI 指纹与有效期（版本与 rcgen 的 x509-parser 特性对齐）；
# - fs2 并发启动文件锁（unix flock / windows LockFileEx，进程退出自动释放，防双实例竞写）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls-pemfile = "2"
time = "0.3"
x509-parser = "0.16"
fs2 = "0.4"
thiserror.workspace = true
# R3-01a 补强：推送去重 SQLite 后端（push/dedupe.rs SqliteDedupeBackend，
# push_events_dedupe 表——S1/S2 审批键持久化，重启不丢；workspace 既有
# 声明（0.31 bundled，conex-db 同栈），零新增锁版本）
rusqlite = { workspace = true }
# R3-03 推送厂商通道：APNs .p8 AuthKey ES256 签名（JWT 头）——ring 0.17
# 已在锁文件（rustls/rcgen 传递依赖），直接声明复用，不新增锁文件条目；
# 用 ECDSA_P256_SHA256_FIXED_SIGNING 直出 JWT 所需裸 r||s 签名（RFC 7518）
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# Win32_UI_Shell / Win32_UI_WindowsAndMessaging：P1-S5 host_openers 默认关联
# 打开改 ShellExecuteW 直调（弃 cmd /C start，防 cmd 二次解释注入）
# Win32_System_Threading：single_instance.rs 单元测试验证命名互斥语义
# （CreateMutexW/ReleaseMutex；真实应用锁由 tauri-plugin-single-instance
# 持有，其自身声明所需 feature）
# Win32_NetworkManagement_IpHelper/Ndis + Win32_Networking_WinSock：
# G-4 网络环境检测（pairing.rs 枚举本机网卡 IP，GetAdaptersAddresses）
# Win32_System_Registry：R1-09 G-4 网络配置文件检测（multi_device_network.rs
# 读 NetworkList\Profiles 的 Category 值判定公用/专用/域）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 浏览器命令面测试：临时数据根（tempfile 3.27 已在锁内，conex-browser dev）
tempfile = "3"
# 服务路由测试（R1-02）：axum Router oneshot（tower util feature；tower
# 0.5 已在锁文件，不新增版本）
tower = { version = "0.5", features = ["util"] }
# WS 集成测试客户端（R1-05）：版本与 axum 0.8 的 ws feature 内置
# tokio-tungstenite 0.29 对齐（锁文件已有条目，零新增锁版本）
tokio-tungstenite = "0.29"

# G5 豁免登记（2026-08-03）：conex-fs 为 01 方案 S3 同轮新建的删除接管 crate，
# 删除工具接线中（trash_list/trash_restore），本壳将立即使用，暂不算未用。
[package.metadata.cargo-machete]
ignored = ["conex-fs"]
