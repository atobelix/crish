[package]
name = "crish-agent-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# protocol-asset：文件管理器图片/PDF 预览（convertFileSrc + asset://）；
# test：壳测试（tauri::test 依赖，PE-11 测试策略）
tauri = { workspace = true, features = ["protocol-asset", "test"] }
tauri-plugin-dialog = "2"
# Dev MCP bridge (Grok/Cursor 调试 live workbench)。仅 debug 注册；插件自身 release 默认不启 socket。
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
url = "2"
reqwest.workspace = true
# 本地服务化（D2 §6.4 / R1-02）：axum 0.8 默认关 feature，显式开
# ws/json/http1/tokio（PE-10 登记：axum 全家一次登记；ws 实际使用留
# R1-05，ws feature 内层 tokio-tungstenite 已在锁文件被 conex-browser
# 消费，不新增版本）
axum = { version = "0.8", default-features = false, features = ["ws", "json", "http1", "tokio"] }
# 令牌 / 配对码 CSPRNG（D2 §7.3：rand 与 getrandom 二选一；getrandom 0.2
# 已在锁文件，直接声明复用，不新增锁文件条目）
getrandom = "0.2"
# 令牌哈希 / 配对码 hex 编码（workspace 已有声明）
hex.workspace = true

sha2 = "0.10"
base64 = "0.22"
chardetng = "0.1"
encoding_rs = "0.8"
memmap2 = "0.9"
tracing.workspace = true
async-trait.workspace = true
# trash 服务 API 契约（conex-fs::trash 返回 anyhow::Result）；G5 清理时 trash 未创建，
# S5 接线后恢复依赖
anyhow.workspace = true
conex-sandbox = { path = "../../../crates/conex-sandbox" }
conex-types = { path = "../../../crates/conex-types" }
conex-compaction = { path = "../../../crates/conex-compaction" }
conex-diff = { path = "../../../crates/conex-diff" }
conex-search = { path = "../../../crates/conex-search" }
conex-fs = { path = "../../../crates/conex-fs" }
conex-db = { path = "../../../crates/conex-db" }
conex-markdown = { path = "../../../crates/conex-markdown" }
# R 轮重写接线：事件存储 / 恢复快照（orchestrator）、会话循环与审批
# （session-loop）、provider 适配（agent-provider）、内置工具（agent-tools）、
# 结构化日志与崩溃文件（conex-telemetry）
orchestrator = { path = "../../../crates/orchestrator" }
session-loop = { path = "../../../crates/session-loop" }
agent-provider = { path = "../../../crates/agent-provider" }
agent-tools = { path = "../../../crates/agent-tools" }
conex-telemetry = { path = "../../../crates/conex-telemetry" }
# 27 接线方案 S3/S6：浏览器进程管理（conex-browser）+ 工具族/门禁（conex-browser-tools）
conex-browser = { path = "../../../crates/conex-browser" }
conex-browser-tools = { path = "../../../crates/conex-browser-tools" }
# Interactive terminal (Windows ConPTY / Unix PTY)
portable-pty = "0.9"
# 多端互通 R1-06（TLS + 自签证书 + 指纹固定，multi_device/tls.rs）：
# - rustls（ring provider，显式装配）与 reqwest 0.13 的 rustls-ring 同栈，不引入第二套 TLS 实现；
# - rcgen 自签 CA/叶子签发（默认 crypto+pem+ring；x509-parser 特性用于从磁盘还原 CA 续签叶子）；
# - tokio-rustls 提供 TlsAcceptor（server 骨架 R1-02 消费）；
# - rustls-pemfile 读取 PEM 证书/私钥（rustls 生态标准件，零传递依赖）；
# - time 构造证书有效期；x509-parser 提取 SPKI 指纹与有效期（版本与 rcgen 的 x509-parser 特性对齐）；
# - fs2 并发启动文件锁（unix flock / windows LockFileEx，进程退出自动释放，防双实例竞写）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls-pemfile = "2"
time = "0.3"
x509-parser = "0.16"
fs2 = "0.4"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# Win32_UI_Shell / Win32_UI_WindowsAndMessaging：P1-S5 host_openers 默认关联
# 打开改 ShellExecuteW 直调（弃 cmd /C start，防 cmd 二次解释注入）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 浏览器命令面测试：临时数据根（tempfile 3.27 已在锁内，conex-browser dev）
tempfile = "3"
# 服务路由测试（R1-02）：axum Router oneshot（tower util feature；tower
# 0.5 已在锁文件，不新增版本）
tower = { version = "0.5", features = ["util"] }
# WS 集成测试客户端（R1-05）：版本与 axum 0.8 的 ws feature 内置
# tokio-tungstenite 0.29 对齐（锁文件已有条目，零新增锁版本）
tokio-tungstenite = "0.29"

# G5 豁免登记（2026-08-03）：conex-fs 为 01 方案 S3 同轮新建的删除接管 crate，
# 删除工具接线中（trash_list/trash_restore），本壳将立即使用，暂不算未用。
[package.metadata.cargo-machete]
ignored = ["conex-fs"]
