# ==============================================================================
# Conex / Crish - 统一模型能力与参数配置文件 (models.yaml)
# ==============================================================================
# 本文件是全系统模型字典的【绝对唯一真源 (SSOT)】：模型能力、参数与计价均以此为准。
# 首次启动时由应用播种到 ~/.conex/models.yaml，此后完全由用户维护。
#
# 字段说明：
#   model             模型标识（必填，全表唯一）
#   vendor            供应商标识（必填）
#   vendorDisplayName 供应商展示名（可选）
#   displayName       界面展示名（可选）
#   contextWindow     上下文窗口上限（可选）
#   maxOutputTokens   单次最大生成上限（可选）
#   protocol          调用协议：openai/chat | openai/responses | anthropic/messages（可选）
#   capabilities      能力开关：tools / image / video / reasoning（可选）
#   pricing           计价（可选）：inputPerMTok / outputPerMTok / cacheReadPerMTok /
#                     cacheWritePerMTok（$/1M Tokens）/ billingUnit(token|per_image) /
#                     perImageCost / currency(USD|CNY)
#
# 数据来源：docs/model-capability/surveys/01-主流模型多源权威数据全景调研.md（官方一手核验）
# ==============================================================================

models:
  # --- OpenAI ---
  - model: gpt-5.6-sol
    vendor: openai
    vendorDisplayName: OpenAI
    displayName: GPT-5.6 Sol
    contextWindow: 1050000
    maxOutputTokens: 128000
    protocol: openai/responses
    capabilities: { tools: true, image: true, reasoning: true }
    pricing: { inputPerMTok: 4.0, outputPerMTok: 20.0, cacheReadPerMTok: 0.4, cacheWritePerMTok: 5.0, billingUnit: token, currency: USD }

