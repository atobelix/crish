<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ipc: http: https: ws: wss:;">
    <title>Crish · AI 工作台</title>
    
    <!-- 内联首屏单图标加载屏 CSS & 多主题适配 (0ms 无缝加载) -->
    <style>
      :root {
        --loader-bg: #0b0b0e;
        --loader-card-bg: linear-gradient(180deg, #131316 0%, #08080a 100%);
        --loader-border: rgba(255, 255, 255, 0.08);
        --loader-line-stroke: #F4F4F5;
        --loader-text: #a1a1aa;
        --loader-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.85);
      }
      
      html[data-theme='light'],
      html[data-theme='default'],
      html.theme-light {
        --loader-bg: #f4f4f5;
        --loader-card-bg: linear-gradient(180deg, #ffffff 0%, #f4f4f5 100%);
        --loader-border: rgba(0, 0, 0, 0.08);
        --loader-line-stroke: #18181B;
        --loader-text: #71717a;
        --loader-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
      }

      html[data-theme='dark'],
      html.theme-dark {
        --loader-bg: #0b0b0e;
        --loader-card-bg: linear-gradient(180deg, #131316 0%, #08080a 100%);
        --loader-border: rgba(255, 255, 255, 0.08);
        --loader-line-stroke: #F4F4F5;
        --loader-text: #a1a1aa;
        --loader-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.85);
      }

      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: var(--loader-bg);
        transition: background-color 0.3s ease;
        user-select: none;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      .app-loader-icon-card {
        width: 110px;
        height: 110px;
        border-radius: 28px;
        background: var(--loader-card-bg);
        border: 1px solid var(--loader-border);
        box-shadow: var(--loader-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: loader-card-breathe 2.4s ease-in-out infinite;
      }

      .app-loader-svg {
        width: 72px;
        height: 72px;
        display: block;
      }

      .app-loader-green-dot {
        fill: #10B981;
        animation: loader-dot-pulse 1.8s ease-in-out infinite;
        transform-origin: 100px 35px;
      }

      .app-loader-lines {
        stroke: var(--loader-line-stroke);
        stroke-width: 26;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        animation: loader-lines-fade 2.4s ease-in-out infinite;
      }

      .app-loader-caption {
        margin-top: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.15em;
        color: var(--loader-text);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0.85;
      }

      .app-loader-spinner-bar {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #10B981;
        display: inline-block;
        animation: loader-dot-blink 1.2s infinite ease-in-out;
      }

      @keyframes loader-card-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      @keyframes loader-dot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.88); }
      }

      @keyframes loader-lines-fade {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.75; }
      }

      @keyframes loader-dot-blink {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>

    <!-- 首屏前应用主题/字体栈，避免闪白；与 themeStore / fontStore 同源 key -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('crish_theme');
          if (t !== 'dark' && t !== 'default' && t !== 'light') {
            var raw = localStorage.getItem('crish_settings') || localStorage.getItem('conex_pi_settings');
            if (raw) {
              var s = JSON.parse(raw);
              t = s && s.theme;
            }
          }
          if (t === 'light') t = 'default';
          if (t !== 'dark') t = 'default';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.add(t === 'dark' ? 'theme-dark' : 'theme-light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'default');
        }
        try {
          var fr = localStorage.getItem('crish_fonts');
          if (!fr) {
            var raw2 = localStorage.getItem('crish_settings') || localStorage.getItem('conex_pi_settings');
            if (raw2) {
              var s2 = JSON.parse(raw2);
              if (s2 && s2.fonts) fr = JSON.stringify(s2.fonts);
            }
          }
          if (fr) {
            var f = JSON.parse(fr);
            if (f && f.uiFont) document.documentElement.setAttribute('data-ui-font', String(f.uiFont).indexOf('local:') === 0 ? 'local' : f.uiFont);
            if (f && f.monoFont) document.documentElement.setAttribute('data-mono-font', String(f.monoFont).indexOf('local:') === 0 ? 'local' : f.monoFont);
          }
        } catch (e2) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 单图标启动加载屏：多主题自适应 (React createRoot 准备就绪后自动替换) -->
      <div class="app-initial-loader" id="skel-app">
        <div class="app-loader-icon-card">
          <svg class="app-loader-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="app-loader-green-dot" cx="100" cy="35" rx="16" ry="16" />
            <g class="app-loader-lines">
              <path d="M 100 118 L 28 118" />
              <path d="M 100 118 L 172 118" />
              <path d="M 100 118 L 58 42" />
              <path d="M 100 118 L 142 42" />
              <path d="M 100 118 L 80 170" />
              <path d="M 100 118 L 120 170" />
            </g>
          </svg>
        </div>
        <div class="app-loader-caption">
          <span class="app-loader-spinner-bar"></span>
          <span>Crish Workstation</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
