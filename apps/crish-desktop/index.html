<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crish · AI 工作台</title>
    
    <!-- CSS Cascade Layers 唯一层序定标：严守 W3C 规范第一规则（reset < base < components < overrides），先于一切 CSS 加载 -->
    <style>@layer reset, base, components, overrides;</style>

    <!-- 首屏单图标加载屏 CSS & 多主题适配 (0ms 无缝加载；生产构建经 cspPlugin 内联为 #crish-critical-css) -->
    <link rel="stylesheet" href="/loader.css" />

    <!-- 首屏前应用主题（只写镜像 crish_theme），避免闪白；生产构建内联为 #crish-critical-js（sha256 进 CSP） -->
    <script src="/loader.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- 单图标启动加载屏：多主题自适应 (React createRoot 准备就绪后自动替换) -->
      <!-- §4.2：仅外层非交互标题带挂 drag-region；SVG/子节点不再叠挂，避免吞点击 -->
      <div class="app-initial-loader" id="skel-app" data-tauri-drag-region>
        <div class="app-loader-icon-card">
          <svg class="app-loader-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="app-loader-green-dot" cx="100" cy="35" rx="16" ry="16" />
            <g class="app-loader-lines">
              <path d="M 100 118 L 28 118" />
              <path d="M 100 118 L 172 118" />
              <path d="M 100 118 L 58 42" />
              <path d="M 100 118 L 142 42" />
              <path d="M 100 118 L 80 170" />
              <path d="M 100 118 L 120 170" />
            </g>
          </svg>
        </div>
        <div class="app-loader-caption">
          <span class="app-loader-spinner-bar"></span>
          <span>Crish Workstation</span>
        </div>
      </div>
    </div>
    <!-- 5 大独立 Multi-Root Portal 挂载容器 -->
    <div id="popover-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div id="tooltip-root"></div>
    <div id="system-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
