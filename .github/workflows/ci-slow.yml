# CI · 慢层（T11.7.4：nightly + 发布前，预算 ≤40 min）
#
# 门禁内容（PE-11 T11.7 / §1.3，慢层）：
# - Rust 压力测试：cargo test --workspace --release --test 'stress_*' -- --ignored（T11.6 场景）
# - TS 压力轨：npm run stress（stress-runner，~60s+）
# - e2e（Playwright，L2 mock 引擎，根 config tests/e2e）
# - 基准：cargo bench（PE-09 T09.7 crates/*/benches，基准目标缺失即失败）
#
# 触发：每日定时 + 手动 dispatch + 版本 tag（发布前必跑）。
# 快层/中层见 ci.yml / ci-mid.yml。

name: CI · 慢层（nightly/发布前）

on:
  schedule:
    # 每日 UTC 02:00（夜间档，避开白天 PR 高峰）
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: ./.github/actions/linux-tauri-deps
      # 压力场景（T11.6）以 #[ignore] 标注、统一放在 tests/stress_*.rs
      # （conex-db/stress_write、session-loop/stress_long_session 等）：release 下运行，不进常规 CI。
      # --test 'stress_*' 只选压力测试目标：工作区里 #[ignore] 还标注了大量
      # 「真实环境探针，非 CI 门禁」（conex-browser e2e_browser/cdp 需本机 Chrome、
      # conex-browser-tools mcp_attach 需 npx+网络、conex-computer(-tools) 需真实
      # 桌面/记事本、conex-doc-collab perf_open_nk_blocks 明确 CI 不跑），
      # 原 `--workspace -- --ignored` 会把它们一并拉起，在 ubuntu runner 上必然失败，
      # 且与本 job「压力层」语义不符。压力目标被误删/改名时 cargo 报
      # no test target matches pattern 直接判红，不会静默空跑。
      # 完整 32 个 #[ignore] 清单与分类详见 docs/rust-rewrite/plans/PE-11-ignored-tests-inventory.md
      - run: cargo test --workspace --release --locked --test 'stress_*' -- --ignored
      # 事件桥吞吐压力（PE-11 T11.6.3，buffer.rs 丢帧语义不丢终态）实现为
      # crish-agent-workbench lib 内的 buffer::stress_tests，不是 tests/stress_*.rs
      # 目标，上一条 --test 'stress_*' 选不到，单独以 lib + 名称过滤运行。
      - run: cargo test -p crish-agent-workbench --release --locked --lib -- --ignored stress_

  stress-ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # TS 压力轨直接 import 生产模块（workspace 包经 dist 解析），先构建 packages
      - run: npm run build:packages
      # TS 压力轨（stress-runner：AI 流 / diff 加载 / 会话切换）
      - run: npm run stress

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npx playwright install --with-deps chromium
      # L2 mock-IPC e2e（根 config：tests/e2e，webServer 自动拉起 dev server）
      # G7 统一：走根脚本 npm run test:e2e（等价 npx playwright test tests/e2e）
      - run: npm run test:e2e

  # Windows 原生 E2E 冒烟（GAP-03 / T-GAP-03）：此前 CI 只有 ubuntu Chromium
  # 的 mock-IPC e2e，进程级真二进制冒烟（tauri-native-smoke.spec.ts）在无
  # 二进制环境永远 describe.skipIf 静默跳过——「二进制可拉起」发布门禁形同虚设。
  # 本 job：windows-latest 构建 debug 二进制 → npm run test:e2e:native 完整执行
  # （WebView2 启动 / 引擎初始化标记 / 干净退出 / 无残存进程）→ 日志留档。
  # 二进制缺失时 spec 前置探针在 CRISH_NATIVE_SMOKE_REQUIRE_BINARY=1 下直接判红。
  native-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: npm install -g npm@11.6.2 && npm ci
      # 构建 debug 二进制（crish-agent-workbench，工作区 target/debug/），
      # 使 spec 的 resolveBinaryPath 命中候选 1，describe.skipIf 不触发
      - run: cargo build -p crish-agent-workbench --locked
      # Tee 留档运行日志（acceptance：job 真实执行并留日志）；exit 透传 vitest 退出码
      - name: Run native smoke（日志留档）
        shell: pwsh
        # 发布门禁：二进制缺失必须判红（spec 前置探针断言），不得退化为 SKIP=2 静默绿
        env:
          CRISH_NATIVE_SMOKE_REQUIRE_BINARY: '1'
        run: |
          npm run test:e2e:native 2>&1 | Tee-Object -FilePath native-smoke-output.log
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-windows-logs
          path: native-smoke-output.log
          if-no-files-found: error

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: ./.github/actions/linux-tauri-deps
      # 基准场景（Criterion，PE-09 T09.7 已落地：agent-provider/sse_parse、
      # conex-db/db_write、orchestrator/event_chain、session-loop/request_build
      # + tool_batch）。
      # - 原「ls crates/*/benches 不存在就 echo 跳过」分支已过时且会静默放行：
      #   基准目录被误删/改名时 job 仍绿。现无条件执行，--bench '*' 匹配不到
      #   任何 [[bench]] 目标时 cargo 直接报错，基准丢失即红。
      # - --bench '*' 只构建并运行 [[bench]] 目标（及其依赖）：--workspace 单独用
      #   会把全部 lib/bin（含 Tauri 壳）按 bench profile 编一遍再跑空的 libtest
      #   --bench，耗时翻倍却不产出任何基准数据。
      - name: 基准（Criterion，crates/*/benches）
        run: cargo bench --workspace --locked --bench '*'
