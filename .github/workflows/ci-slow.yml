# CI · 慢层（T11.7.4：nightly + 发布前，预算 ≤40 min）
#
# 门禁内容（PE-11 T11.7 / §1.3，慢层）：
# - Rust 压力测试：cargo test --workspace --release -- --ignored（T11.6 场景）
# - TS 压力轨：npm run stress（stress-runner，~60s+）
# - e2e（Playwright，L2 mock 引擎，根 config tests/e2e）
# - 基准：cargo bench（PE-09 T09.7 落地 crates/*/benches 后自动生效）
#
# 触发：每日定时 + 手动 dispatch + 版本 tag（发布前必跑）。
# 快层/中层见 ci.yml / ci-mid.yml。

name: CI · 慢层（nightly/发布前）

on:
  schedule:
    # 每日 UTC 02:00（夜间档，避开白天 PR 高峰）
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      # 压力场景全部 #[ignore]（T11.6）：release 下运行，不进常规 CI
      - run: cargo test --workspace --release --locked -- --ignored

  stress-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # TS 压力轨（stress-runner：AI 流 / diff 加载 / 会话切换）
      - run: npm run stress

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npx playwright install --with-deps chromium
      # L2 mock-IPC e2e（根 config：tests/e2e，webServer 自动拉起 dev server）
      # G7 统一：走根脚本 npm run test:e2e（等价 npx playwright test tests/e2e）
      - run: npm run test:e2e

  # Windows 原生 E2E 冒烟（GAP-03 / T-GAP-03）：此前 CI 只有 ubuntu Chromium
  # 的 mock-IPC e2e，进程级真二进制冒烟（tauri-native-smoke.spec.ts）在无
  # 二进制环境永远 describe.skipIf 静默跳过——「二进制可拉起」发布门禁形同虚设。
  # 本 job：windows-latest 构建 debug 二进制 → npm run test:e2e:native 完整执行
  # （WebView2 启动 / 引擎初始化标记 / 干净退出 / 无残存进程）→ 日志留档。
  # 二进制仍缺失时测试内前置探针显式报 SKIP 数（不得静默，见 spec 内探针块）。
  native-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - run: npm install -g npm@11.6.2 && npm ci
      # 构建 debug 二进制（crish-agent-workbench，工作区 target/debug/），
      # 使 spec 的 resolveBinaryPath 命中候选 1，describe.skipIf 不触发
      - run: cargo build -p crish-agent-workbench --locked
      # Tee 留档运行日志（acceptance：job 真实执行并留日志）；exit 透传 vitest 退出码
      - name: Run native smoke（日志留档）
        shell: pwsh
        run: |
          npm run test:e2e:native 2>&1 | Tee-Object -FilePath native-smoke-output.log
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-smoke-windows-logs
          path: native-smoke-output.log
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      # 基准场景（Criterion，PE-09 T09.7 新建 crates/*/benches）：
      # 落地前跳过并提示，落地后自动生效
      - name: 基准（存在基准场景时运行）
        run: |
          if ls crates/*/benches >/dev/null 2>&1; then
            cargo bench --workspace --locked
          else
            echo "暂无基准场景（crates/*/benches 不存在，PE-09 T09.7 落地后生效）"
          fi
