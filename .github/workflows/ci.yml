# CI · 快层（T11.7.4：每次提交/PR 的即时反馈，预算 ≤15 min）
#
# 门禁内容（PE-11 T11.7，快层）：
# - cargo check --workspace --locked（--locked：T10.1 锁定依赖）
# - 关键单元测试快速套件：conex-types + session-loop
# - 前端 typecheck / vitest 快集（unit 项目）
# - 静态与安全：eslint / depcruise / audit / cargo-deny / secret-scan
#
# 中层全量验证见 ci-mid.yml（cargo test 全量 + clippy + vitest 全量）；
# 慢层（压力 / e2e / 基准）见 ci-slow.yml。

name: CI · 快层（提交/PR）

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # G7 统一：typecheck 走根脚本（npm run typecheck = 7 段 tsc 直跑；
      # 与 npx turbo run typecheck 覆盖等价，口径对齐 G7 盘点）
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx depcruise --config .dependency-cruiser.cjs packages apps --ignore "dist/"

  vitest-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 前端快集：仅 unit 项目（F1 纯逻辑 + F2 组件，用例基线主体）
      # --coverage：强制执行 vitest.config.ts 根 coverage 块的阈值门禁。
      #（2026-08-03 审计：此前未带 --coverage，且项目级阈值被根配置整体覆盖，
      #  70/60/65/70 从未生效；实测基线 47.02/77.37/69.69/47.02，阈值已按基线
      #  校准为 45/70/65/45，低于阈值即失败）
      # G7 统一：vitest 调用走根脚本（npm run test:coverage = vitest run --coverage，
      # 追加 --project=unit 透传快层专项口径）
      - run: npm run test:coverage -- --project=unit --reporter=verbose

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # 生成物漂移门禁（2026-08-03 审计：gen:engine-bindings 是手动脚本，CI 未跑；
  # registry_drift 只锁 JSON↔Rust，不锁 JSON↔TS）。
  # 生成物提交在仓库内（packages/shared-types/src/generated/engine），
  # 此处重新生成后 diff：events.rs / engine-events.json 更新但未跑生成器即失败。
  engine-bindings-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/generate-engine-bindings.mjs
      - run: git diff --exit-code -- packages/shared-types/src/generated

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: EmbarkStudios/cargo-deny-action@v2

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # 快层只做编译门禁（--locked 锁定 Cargo.lock，T10.1）；
      # clippy 已归中层（ci-mid.yml，全量验证门禁）
      - run: cargo check --workspace --locked

  rust-unit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # 关键单元测试快速套件（T11.7 快层）：conex-types（类型/契约域）+
      # session-loop（主循环核心，含流式契约锚点）
      - run: cargo test -p conex-types -p session-loop --locked
