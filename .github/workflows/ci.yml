# 核心类型检查 + 单测（desktop helpers + agent packages）
name: ci

on:
  push:
    branches: [main, master, 'refactor/**']
  pull_request:
    branches: [main, master, 'refactor/**']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck core packages
        run: npm run check:core
      - name: Unit tests (core + desktop helpers)
        run: |
          npx vitest run \
            packages/agent-runtime/src \
            packages/agent-orchestrator/src \
            packages/agent-daemon/src \
            apps/crish-desktop/src/api \
            apps/crish-desktop/src/store
