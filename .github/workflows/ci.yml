# CI · 快层（T11.7.4：每次提交/PR 的即时反馈，预算 ≤15 min）
#
# 门禁内容（PE-11 T11.7，快层）：
# - cargo check --workspace --locked（--locked：T10.1 锁定依赖）
# - 关键单元测试快速套件：conex-types + session-loop
# - 前端 typecheck / vitest 快集（unit 项目）
# - 静态与安全：eslint / depcruise / audit / cargo-deny / secret-scan
#
# 中层全量验证见 ci-mid.yml（cargo test 全量 + clippy + vitest 全量）；
# 慢层（压力 / e2e / 基准）见 ci-slow.yml。

name: CI · 快层（提交/PR）

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # G7 统一：typecheck 走根脚本（npm run typecheck = 7 段 tsc 直跑；
      # 与 npx turbo run typecheck 覆盖等价，口径对齐 G7 盘点）
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      # depcruise 无 --ignore 参数（dependency-cruiser 16.x 仅 -x/--exclude 与
      # --ignore-known）；dist 排除已由 .dependency-cruiser.cjs options.exclude
      # 覆盖（node_modules|dist|build|target），与仓库脚本 lint:depcruise 同口径
      - run: npx depcruise --config .dependency-cruiser.cjs packages apps
      # store 写路径门禁（T-E 批次 5.4）：生产代码 raw *Store.setState 归零 +
      # store 类型/切片纪律（check:store-types）
      - run: npm run check:store-writes
      - run: npm run check:store-types
      # store 直引门禁（T-E 批次 5 脚本 + T-C 批次 7.4 迁移归零后接线）：
      # components 直引 src/store/ 非白名单入口（store/index barrel / storeAccess /
      # store/types）计数必须为 0；基线文件 scripts/components-store-direct-imports.json
      # 随迁移归零而清空（T14 已清零，见 05-detail 提交 G 阶段 3）。
      - run: npm run check:store-facade
      # 行数门禁（T-E 批次 7.3 · 05 方案步骤②）：三级语义（85% 警告 / 100% 违规 /
      # >650 硬阻断）+ per-file 基线（基线记录/frontend-line-counts-baseline.md，
      # 存量登记、增长必 fail、--update 显式收紧）。
      - run: npm run check:line-counts
      # 吞错门禁本体 = eslint 本地规则 local/no-silent-catch（上方 npx eslint . 自动生效，
      # 零新增 job）；报告模式便于 diff 观察趋势，非门禁本体。
      - run: npm run check:swallowed-errors-frontend
      - run: npm run check:css-encoding

  vitest-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 前端快集：仅 unit 项目（F1 纯逻辑 + F2 组件，用例基线主体）
      # --coverage：强制执行 vitest.config.ts 根 coverage 块的阈值门禁。
      #（2026-08-03 审计：此前未带 --coverage，且项目级阈值被根配置整体覆盖，
      #  70/60/65/70 从未生效；实测基线 47.02/77.37/69.69/47.02，阈值已按基线
      #  校准为 45/70/65/45，低于阈值即失败）
      # G7 统一：vitest 调用走根脚本（npm run test:coverage = vitest run --coverage，
      # 追加 --project=unit 透传快层专项口径）
      - run: npm run test:coverage -- --project=unit --reporter=verbose

  # 生产构建门禁（06-步骤1，P1-1）：产物从未被机器验证 → 首次在 CI 构建并断言。
  # N2 前置：@crish/shared-types 的 exports.default 指向 dist/index.js（CI 无 dist
  # 缓存），必须先 build:shared-types——命令链顺序固定，颠倒即失败。
  # 门禁承载：scripts/check-dist.mjs 单一断言脚本（App <500KB + vendor-tiptap/xterm
  # 拆分落地 + --csp-enforce 严格 CSP 四断言，T3-4，CSP 唯一真源 cspPlugin 于
  # 批次 7.2 已落地）；chunk 体积上限由 vite 配置层抛错门禁承载（chunkSizeGatePlugin，
  # 06-步骤2 onwarn 草案在 vite 7 无 CHUNK_SIZE_WARN 管道，实读 vite 7.3.5 调整）。
  # 与 typecheck job 的 tsc -b 职责重叠：口径统一优先（06 风险 R6），独立 job 并行。
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:shared-types
      - run: npm run build:desktop
      - run: node scripts/check-dist.mjs --max-app-kb 500 --csp-enforce

  # 移动端快层门禁（R2-01，D8 §5.2/§5.5）：Expo 工程 typecheck + jest-expo 单测。
  # Node 22：Expo SDK 57 要求 Node ≥ 22.13.x（D4 §2.3），与桌面端 node 20 不同。
  # jest 独立于根 vitest（jsdom/RN 双环境互不污染，D8 §5.2）；覆盖率阈值
  # 60/75/70/60 在 apps/crish-mobile/jest.config.js 内（D8 第 9 章）。
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @crish/crish-mobile
      - run: npm test -w @crish/crish-mobile -- --ci

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # 生成物漂移门禁（2026-08-03 审计：gen:engine-bindings 是手动脚本，CI 未跑；
  # registry_drift 只锁 JSON↔Rust，不锁 JSON↔TS）。
  # 生成物提交在仓库内（packages/shared-types/src/generated/engine），
  # 此处重新生成后 diff：events.rs / engine-events.json 更新但未跑生成器即失败。
  engine-bindings-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/generate-engine-bindings.mjs
      - run: git diff --exit-code -- packages/shared-types/src/generated

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: EmbarkStudios/cargo-deny-action@v2

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # 快层只做编译门禁（--locked 锁定 Cargo.lock，T10.1）；
      # clippy 已归中层（ci-mid.yml，全量验证门禁）
      - run: cargo check --workspace --locked

  rust-unit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # 关键单元测试快速套件（T11.7 快层）：conex-types（类型/契约域）+
      # session-loop（主循环核心，含流式契约锚点）
      - run: cargo test -p conex-types -p session-loop --locked
