# CI · 快层（T11.7.4：每次提交/PR 的即时反馈，预算 ≤15 min）
#
# 门禁内容（PE-11 T11.7，快层）：
# - cargo check --workspace --locked（--locked：T10.1 锁定依赖）
# - 关键单元测试快速套件：conex-types + session-loop
# - 前端 typecheck / vitest 快集（unit 项目）
# - 静态与安全：eslint / depcruise / audit / cargo-deny / secret-scan
#
# 中层全量验证见 ci-mid.yml（cargo test 全量 + clippy + vitest 全量）；
# 慢层（压力 / e2e / 基准）见 ci-slow.yml。

name: CI · 快层（提交/PR）

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'

# 同一分支/PR 的新提交取消旧运行；main 上每个提交都要有完整结论（便于定位哪次提交引入红），不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # G7 统一：typecheck 走根脚本（npm run typecheck = 7 段 tsc 直跑；
      # 与 npx turbo run typecheck 覆盖等价，口径对齐 G7 盘点）
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npx eslint .
      # depcruise 无 --ignore 参数（dependency-cruiser 16.x 仅 -x/--exclude 与
      # --ignore-known）；dist 排除已由 .dependency-cruiser.cjs options.exclude
      # 覆盖（node_modules|dist|build|target），与仓库脚本 lint:depcruise 同口径
      - run: npx depcruise --config .dependency-cruiser.cjs packages apps
      # store 写路径门禁（T-E 批次 5.4）：生产代码 raw *Store.setState 归零 +
      # store 类型/切片纪律（check:store-types）
      - run: npm run check:store-writes
      - run: npm run check:store-types
      # store 直引门禁（T-E 批次 5 脚本 + T-C 批次 7.4 迁移归零后接线）：
      # components 直引 src/store/ 非白名单入口（store/index barrel / storeAccess /
      # store/types）计数必须为 0；基线文件 scripts/components-store-direct-imports.json
      # 随迁移归零而清空（T14 已清零，见 05-detail 提交 G 阶段 3）。
      - run: npm run check:store-facade
      # 行数门禁（T-E 批次 7.3 · 05 方案步骤②）：三级语义（85% 警告 / 100% 违规 /
      # >650 硬阻断）+ per-file 基线（基线记录/frontend-line-counts-baseline.md，
      # 存量登记、增长必 fail、--update 显式收紧）。
      - run: npm run check:line-counts
      # UI 层收敛门禁（G-01~G-12 合规）：裸原生交互标签 / cloneElement /
      # radius-full 药丸圆角 / Z-Index 标尺 / !important / 废弃全局样式 /
      # switch(panelId) 解析 / 伪门面别名 / 空态渗透 / onShowToast 透传 /
      # 原生 title 悬浮提示——与 check:desktop 同口径，CI 单独接线确保 PR 级拦截
      - run: npm run check:ui-layer
      # 吞错门禁本体 = eslint 本地规则 local/no-silent-catch（上方 npx eslint . 自动生效，
      # 零新增 job）；报告模式便于 diff 观察趋势，非门禁本体。
      - run: npm run check:swallowed-errors-frontend
      - run: npm run check:css-encoding
      # token 一致性门禁（G1/G2 · docs/design-token-ssot/00-总方案 §6.5）：
      # var() 引用完整性（未定义引用）+ 死 token 计数，基线 ratchet
      # （基线记录/token-consistency-baseline.md，新增即 fail、--update 显式收紧）。
      # 与 check:desktop 同口径，CI 单独接线确保 PR 级拦截。
      - run: npm run check:token-consistency
      # 收敛硬闸（X1/R9）：被跟踪运行时产物与波次命名文件必须归零
      - run: node scripts/check-convergence-metrics.mjs
      # 引用即入库（A11）：workflow / action / husky / package.json 引用的文件必须被 git 跟踪，
      # 防止 .gitignore 白名单模式把配置吞掉（.dependency-cruiser.cjs 曾因此从未入库）
      - run: node scripts/check-referenced-files-tracked.mjs
      # U-GATE 防御探针（detail-D2 §6.3）：生产 .rs 禁止 per-call
      # CommandGatekeeper::new()（测试/`conex-sandbox` 单测白名单）；
      # 与 new() 清零同票落地，防回潮。
      - run: npm run check:gatekeeper-shared
      # 模型配置 SSOT 总门禁（docs/model-config-ssot-convergence/plans/08）：
      # 词表唯一权威（THINKING_LEVEL_IDS 生产代码归零）+ 字典 thinking 键 ⊆ 内核
      # 接受集，并委派词表镜像 / 源码资产入库两条子门禁。与 check:desktop 同口径，
      # CI 单独接线确保 PR 级拦截。
      - run: npm run check:model-config-ssot
      # 自动化 npm 许可证扫描门禁（P1-LIC-01）：扫描生产依赖，阻断强 Copyleft
      - run: node scripts/check-npm-licenses.mjs

  vitest-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # 前端快集：仅 unit 项目（F1 纯逻辑 + F2 组件，用例基线主体）
      # --coverage：强制执行 vitest.config.ts 根 coverage 块的阈值门禁。
      #（2026-08-03 审计：此前未带 --coverage，且项目级阈值被根配置整体覆盖，
      #  70/60/65/70 从未生效；实测基线 47.02/77.37/69.69/47.02，阈值已按基线
      #  校准为 45/70/65/45，低于阈值即失败）
      # G7 统一：vitest 调用走根脚本（npm run test:coverage = vitest run --coverage，
      # 追加 --project=unit 透传快层专项口径）
      - run: npm run test:coverage -- --project=unit --reporter=verbose
      # per-package 阈值门禁（GAP-07 / T-DEBT-13 接线）：读 json-summary 产物
      # coverage/coverage-summary.json（reporter 已在 vitest.config.ts 根 coverage
      # 块补齐），对 shared-types ≥80 / shared-utils ≥70 / crish-desktop ≥45 逐包
      # 判定。summary 缺失或某包无数据一律 FAIL（缺报告 = 门禁未执行，不得静默放行）。
      # 当前 warn-only：2026-10-21 实测 unit 口径 statements —— shared-types
      # 24.14% / shared-utils 24.54% / crish-desktop 33.39%，与目标阈值缺口大
      # （禁止下调阈值还债，见账本 T-GAP-07 验收）。blocking 接线会让快层全红；
      # 先显式报数建立下降型 ratchet，补真实测试达标后删除 continue-on-error 转
      # blocking（详见 .agent-outputs/2026-10-20-ci-quality/gap07-coverage-gate.md）。
      - continue-on-error: true # TODO(T-GAP-07)：三包实测达标后移除，转 blocking
        run: node scripts/check-coverage-threshold.mjs

  # 生产构建门禁（06-步骤1，P1-1）：产物从未被机器验证 → 首次在 CI 构建并断言。
  # N2 前置：@crish/shared-types 的 exports.default 指向 dist/index.js（CI 无 dist
  # 缓存），必须先 build:shared-types——命令链顺序固定，颠倒即失败。
  # 门禁承载：scripts/check-dist.mjs 单一断言脚本（App <500KB + vendor-tiptap/xterm
  # 拆分落地 + --csp-enforce 严格 CSP 四断言，T3-4，CSP 唯一真源 cspPlugin 于
  # 批次 7.2 已落地）；chunk 体积上限由 vite 配置层抛错门禁承载（chunkSizeGatePlugin，
  # 06-步骤2 onwarn 草案在 vite 7 无 CHUNK_SIZE_WARN 管道，实读 vite 7.3.5 调整）。
  # 与 typecheck job 的 tsc -b 职责重叠：口径统一优先（06 风险 R6），独立 job 并行。
  frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npm run build:shared-types
      - run: npm run build:desktop
      - run: node scripts/check-dist.mjs --max-app-kb 500 --csp-enforce
      # 启动体积门禁（D9-A / U-START-GATE · 16-P2）：entry + 静态图合计 fail。
      # 必须在 build:desktop 之后（依赖 dist/.vite/manifest.json）；--strict 使
      # 超预算 exit 1（禁 warn 永久化，评审 F9）。deny 命中任何模式 exit 1。
      - run: node scripts/check-startup-budget.mjs --strict
      # chunk 环检测（R2-4 C1）：依赖构建产物 dist/（脚本默认 apps/crish-desktop/dist），
      # 必须在此构建后 job 执行——lint job 无 dist，接线过去会因「dist 目录不存在」直接红
      - run: npm run check:chunk-cycles

  # 移动端快层门禁（R2-01，D8 §5.2/§5.5）：Expo 工程 typecheck + jest-expo 单测。
  # Node 版本与全仓一致取 .nvmrc（24）：Expo SDK 57 要求 Node ≥ 22.13.x（D4 §2.3），
  # react-native 0.86 要求 ^24.3.0（Node 24 线）；lint-staged 17 要求 ≥22.22.1，统一后桌面端与移动端不再分裂。
  # jest 独立于根 vitest（jsdom/RN 双环境互不污染，D8 §5.2）；覆盖率阈值
  # 60/75/70/60 在 apps/crish-mobile/jest.config.js 内（D8 第 9 章）。
  mobile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npm run typecheck -w @crish/crish-mobile
      - run: npm test -w @crish/crish-mobile -- --ci

  # 格式化漂移门禁（DEBT-05 / T-DEBT-05 接线）：prettier --check + cargo fmt --check。
  # 当前为 warn-only（continue-on-error）：存量漂移面大（prettier 数十文件 warn +
  # 4 个解析错误；cargo fmt 见 apps/agent-workbench/src-tauri/src/push/copy.rs 等），
  # 按 T-DEBT-05 验收步骤 2 需先一次性 `--write` / `cargo fmt` 单独提交（不夹带
  # 逻辑改动）——该步未执行前 blocking 接线会让快层全红。存量清零提交落地后，
  # 删除两处 continue-on-error 即转 blocking（两条命令必须 exit 0）。
  format-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true # TODO(T-DEBT-05)：存量格式化清零单独提交后移除，转 blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npx prettier --check .
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo fmt --all -- --check

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # 依赖审计（SEC-03 / T-SEC-03 扩面）：原仅 6 个桌面工作区，遗漏
      # plugin-import-claude-codex / test-utils / block-paper-contract /
      # conversation-flow。除移动端（apps/crish-mobile，T-SEC-03-a 用户裁决
      # §3.4-2 暂缓）外的全部 workspace 纳入。扩面后生产依赖实测 0 漏洞。
      # dev 工具链：tinypool 双 critical（GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr）
      # 已由根 package.json overrides 强制 ^2.2.0 修复（vitest 3.2 兼容实测通过）；
      # @vitest/mocker 路径穿越（GHSA-82fw-gwwq-j7x9，moderate）修复需 vitest 5
      # major 迁移，登记隔离中（dev-only 不进产物，见 SEC-03 证据包）。
      - run: npm audit --omit=dev --audit-level=moderate -w @crish/crish-desktop -w @crish/agent-workbench -w @crish/editor-kit -w @crish/block-paper -w @crish/shared-utils -w @crish/shared-types -w @crish/plugin-import-claude-codex -w @crish/test-utils -w @crish/block-paper-contract -w @crish/conversation-flow

  # 生成物漂移门禁（2026-08-03 审计：gen:engine-bindings 是手动脚本，CI 未跑；
  # registry_drift 只锁 JSON↔Rust，不锁 JSON↔TS）。
  # 生成物提交在仓库内（packages/shared-types/src/generated/engine），
  # 此处重新生成后 diff：events.rs / engine-events.json 更新但未跑生成器即失败。
  engine-bindings-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: node scripts/generate-engine-bindings.mjs
      - run: git diff --exit-code -- packages/shared-types/src/generated

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # cargo-deny 以锁定版本安装在宿主 runner 上、用 rust-toolchain.toml 的同一 cargo 解析
      # metadata（原 docker 版 cargo-deny-action 自带镜像内 Rust 与浮动的 cargo-deny 版本，
      # 与本地复现口径不一致）。本地复现：cargo install cargo-deny --version 0.20.2 --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      # 与原 action 默认参数等价：check 全部检查项（advisories/bans/licenses/sources），--all-features
      - run: cargo deny --locked --all-features check

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 全量历史：gitleaks-action 按事件计算提交范围（push: before..after / PR: base..head），
      # 浅克隆（默认 fetch-depth: 1）下范围端点不存在 → git log 报 unknown revision →
      # 「failed to scan Git repository / scanned ~0 bytes」即整步失败（2026-10 实测）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # PR 事件下 action 需调用 GitHub API 取 PR 提交列表；个人账号仓库无需 GITLEAKS_LICENSE
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: ./.github/actions/linux-tauri-deps
        if: runner.os == 'Linux'
      # 跨平台编译门禁（Linux / Windows / macOS 原生契约验证）：
      # --locked 锁定依赖版本
      - run: cargo check --workspace --locked

  rust-unit-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # session-loop 依赖链经 conex-* 拉入 glib/webkit 系 sys crate，Linux 需系统开发包
      - uses: ./.github/actions/linux-tauri-deps
      # 关键单元测试快速套件（T11.7 快层）：conex-types（类型/契约域）+
      # session-loop（主循环核心，含流式契约锚点）
      - run: cargo test -p conex-types -p session-loop --locked
