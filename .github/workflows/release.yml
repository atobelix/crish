name: Release · 多平台桌面端发布（GitHub Release）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（v 前缀，须与 apps/agent-workbench/src-tauri/tauri.conf.json 的 version 一致，如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # SEC-06：发布版本号校验（job 早期）。tag 触发取 github.ref_name；
      # 手动触发取必填 inputs.version。禁止回退到硬编码 v0.1.0；
      # 与 tauri.conf.json 的 version 不一致时直接失败并打印两者。
      - name: Validate release version (SEC-06)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="$REF_NAME"
          else
            version="$INPUT_VERSION"
          fi
          echo "发布版本号（来源 $EVENT_NAME）: ${version:-<空>}"
          if [ -z "$version" ]; then
            echo "::error::SEC-06 未取得发布版本号：tag 触发应取 github.ref_name，手动触发必须提供必填 inputs.version（禁止默认回退 v0.1.0）"
            exit 1
          fi
          conf=$(node -p "require('./apps/agent-workbench/src-tauri/tauri.conf.json').version")
          echo "tauri.conf.json version: $conf"
          if [ "v$conf" != "$version" ]; then
            echo "::error::SEC-06 发布版本号不一致：tag/inputs = $version vs tauri.conf.json = v$conf"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本校验通过：$version"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true

      - name: Install npm dependencies
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Build frontend dependencies
        run: |
          npm run build:shared-types
          npm run build:desktop

      - name: Build Tauri Desktop & Draft Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # SEC-06：tagName/releaseName 只取上方校验通过的 RELEASE_VERSION
          #（tag 触发 = github.ref_name；手动触发 = 必填 inputs.version），
          # 不再回退硬编码 v0.1.0
          tagName: ${{ env.RELEASE_VERSION }}
          releaseName: 'Crish ${{ env.RELEASE_VERSION }}'
          releaseDraft: true
          prerelease: false
          projectPath: apps/agent-workbench

      - name: Generate and upload SHA256 checksums (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SEC-07：tauri-action 实际输出的产物清单（JSON 数组）
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          # SEC-07：产物清单 = 固定 bundle 目录扫描 + tauri-action artifactPaths 输出；
          # 找不到任何产物时立即失败，禁止静默跳过。
          collect() {
            for dir in target/release/bundle apps/agent-workbench/src-tauri/target/release/bundle apps/agent-workbench/target/release/bundle; do
              if [ -d "$dir" ]; then
                find "$dir" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.tar.gz" \)
              fi
            done
            if [ -n "$TAURI_ARTIFACT_PATHS" ]; then
              printf '%s' "$TAURI_ARTIFACT_PATHS" | jq -r '.[]' | while IFS= read -r f; do
                case "$f" in
                  *.deb|*.AppImage|*.dmg|*.app.tar.gz|*.tar.gz) [ -f "$f" ] && echo "$f" ;;
                esac
              done
            fi
          }
          tmp=$(mktemp)
          collect | sort -u > "$tmp"
          echo "发现产物 $(wc -l < "$tmp") 个："
          cat "$tmp"
          if [ ! -s "$tmp" ]; then
            echo "::error::SEC-07 未找到任何 Tauri 产物（bundle 目录与 tauri-action artifactPaths 均为空），checksum 步骤失败"
            rm -f "$tmp"
            exit 1
          fi
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              dirname=$(dirname "$file")
              echo "Generating SHA256 checksum for $filename..."
              if command -v sha256sum >/dev/null 2>&1; then
                (cd "$dirname" && sha256sum "$filename" > "${filename}.sha256")
              else
                (cd "$dirname" && shasum -a 256 "$filename" > "${filename}.sha256")
              fi
              echo "Uploading checksum for $filename..."
              gh release upload "$RELEASE_VERSION" "${dirname}/${filename}.sha256" --clobber || {
                echo "Retrying checksum upload..."
                sleep 2
                gh release upload "$RELEASE_VERSION" "${dirname}/${filename}.sha256" --clobber
              }
            fi
          done < "$tmp"
          rm -f "$tmp"

      - name: Generate and upload SHA256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SEC-07：tauri-action 实际输出的产物清单（JSON 数组）
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          # SEC-07：产物清单 = 固定 bundle 目录扫描 + tauri-action artifactPaths 输出；
          # 找不到任何产物时立即失败，禁止静默跳过。
          $exts = @('.msi', '.exe', '.zip')
          $paths = @("target\release\bundle", "apps\agent-workbench\src-tauri\target\release\bundle", "apps\agent-workbench\target\release\bundle")
          $files = @()
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $files += Get-ChildItem -Path $p -Recurse -File | Where-Object { $exts -contains $_.Extension }
            }
          }
          if ($env:TAURI_ARTIFACT_PATHS) {
            try {
              $listed = @($env:TAURI_ARTIFACT_PATHS | ConvertFrom-Json) | ForEach-Object {
                if ($_ -and (Test-Path $_) -and ($exts -contains [System.IO.Path]::GetExtension($_))) { Get-Item $_ }
              }
              $files += $listed
            } catch {
              Write-Host "::error::SEC-07 tauri-action artifactPaths 输出无法解析：$_"
              exit 1
            }
          }
          $files = @($files | Sort-Object -Property FullName -Unique)
          Write-Host "发现产物 $($files.Count) 个："
          $files | ForEach-Object { Write-Host "  $($_.FullName)" }
          if ($files.Count -eq 0) {
            Write-Host "::error::SEC-07 未找到任何 Tauri 产物（bundle 目录与 tauri-action artifactPaths 均为空），checksum 步骤失败"
            exit 1
          }
          foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            $chkFile = "$($f.FullName).sha256"
            "$hash  $($f.Name)" | Out-File -FilePath $chkFile -Encoding ascii
            Write-Host "Uploading checksum for $($f.FullName)..."
            gh release upload "$env:RELEASE_VERSION" $chkFile --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Retrying checksum upload..."
              Start-Sleep -Seconds 2
              gh release upload "$env:RELEASE_VERSION" $chkFile --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
