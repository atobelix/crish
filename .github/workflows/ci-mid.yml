# CI · 中层（T11.7.4：合并前全量验证，预算 ≤20 min）
#
# 门禁内容（PE-11 T11.7，中层）：
# - cargo test --workspace 全量（L1 单测 + L2 集成 + L3 契约 + L4 e2e faux；
#   --ignored 压力场景除外，归慢层）
# - cargo clippy --workspace --all-targets --locked -- -D warnings（终态，无基线豁免）
# - 前端 vitest 全量（vitest.config.ts：unit + integration + native-smoke 项目；
#   e2e 项目已于 PS-02 T2.1 删除，Playwright spec 归 Playwright 轨道）
# - F3 专项：integration / fuzz / race / recovery（vitest.integration.config.ts）
#
# 触发：PR（合并前必跑）+ main 分支 push（主干兜底）。
# 快层即时反馈见 ci.yml；慢层见 ci-slow.yml。

name: CI · 中层（合并前全量）

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'

# 同一分支/PR 的新提交取消旧运行；main 上每个提交都要有完整结论（便于定位哪次提交引入红），不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: ./.github/actions/linux-tauri-deps
      # 全量测试：L1 单测 + L2 集成 + L3 契约（含流式契约锚点）+ L4 e2e faux
      # --locked（T10.1）：Cargo.lock 已入库，锁漂移在漂移状态下结果不可复现
      - run: cargo test --workspace --locked

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
      - uses: ./.github/actions/linux-tauri-deps
      # 终态口径（G12）：--all-targets + -D warnings，任何 clippy 告警即失败。
      # 原「warn 级 + check-clippy-baseline.mjs 基线 ratchet」已退役：setup-rust-toolchain
      # 默认注入 RUSTFLAGS=-D warnings，第一条告警即编译失败，ratchet 脚本永远跑不到，
      # 基线形同虚设；存量告警由代码修复清零，不再登记基线。
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # 前端 vitest 全量（vitest.config.ts 项目：unit + integration + native-smoke）
      # 覆盖率门禁在快层 ci.yml 强制执行（unit 项目 --coverage，阈值 45/70/65/45）。
      # 中层不加 --coverage 的理由（2026-08-03 实测基线）：
      #   - integration 项目实测 3.75% / 61.16% / 33.5% / 3.75%，远低于 45/70/65/45；
      #     待 integration 用例扩增后再启用。
      # PS-02 T2.1 修复后现状：e2e 项目块已删除（原 include 唯一匹配面是 tests/e2e
      # 的 Playwright spec，test.describe 与 vitest 运行器冲突，21/21 必红）；
      # Playwright spec 一律归 Playwright（tests/e2e，见下方 e2e job）；
      # tauri-native-smoke 重归属独立 native-smoke 项目（vitest 进程级冒烟）。
      - run: npm run test -- --reporter=verbose

  test-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      # F3 层：integration / fuzz / race / recovery 四目录
      # （vitest.integration.config.ts，PS-02 T2.1 起 test.projects 单项目）
      - run: npx vitest run --config vitest.integration.config.ts --reporter=verbose

  machete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # cargo-machete 不随 Rust 工具链提供，必须显式安装（此前未安装 → no such command: machete）；
      # 锁定版本保证本地与 CI 判定一致。本地复现：cargo install cargo-machete --version 0.9.2 --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete@0.9.2
      # machete 例外论证（PS-02 T2.5）：不编译、不解析依赖树，锁漂移不影响
      # 其结果；实跑 `cargo machete --locked` → Unrecognized argument EXIT=1
      # （透传不可用），故不加 --locked
      - run: cargo machete

  # e2e 冒烟子集（PS-02 T2.7 / D3 裁决：进 PR 门禁；全量仍归 ci-slow nightly）。
  # 子集 = 5 个冒烟 spec：3 个 markdown-editor 专项（ast-block-tables /
  # format-checker / wysiwyg-interaction，AGENTS.md 保护名单，驱动 5173
  # reference/markdown-editor dev server，见 playwright.config.ts 第二
  # webServer）+ cache-telemetry / cache-metrics（缓存链路健康锚点）。
  # 偏差登记（F-005）：保护名单中的 ime-composition / keyboard-navigation 依赖
  # pre-M3/M4 交互模型（空文本编辑器常驻 + textarea），当前引擎（f772eb99）
  # 空文本卸载编辑器——两 spec 确定性失败，需编辑器域适配（另立任务），
  # 不入冒烟子集；cursor-debug / editor-fuzz-thrash 亦为既存失败（非保护名单）。
  # vitest 面已不收集 tests/e2e（T2.1），Playwright 唯一拥有者，无重复冲突。
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke

  # 死代码门禁（PS-02 T2.6 接线）：error 级规则决定退出码（files/dependencies/
  # devDependencies/unresolved）；exports/types/unlisted/binaries/duplicates 为
  # warn 级（594+ 长尾登记 P2 收敛清单，不阻塞）。存量收敛：
  # AgentToolRowRenderer.tsx 删除（全仓零引用，含字符串/动态引用 + git log 核实）；
  # rimraf/tasklist 登记 ignoreBinaries（真实消费，见 knip.config.ts 注释）。
  knip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.2 && npm ci
      - run: npm run knip

  # I8 治理收口（G3/G4/G6）：unwrap / 吞错 / 行数 三基线 ratchet。
  # 基线真源：docs/multi-agent-repair/基线记录/{unwrap,swallowed-errors,crate-size}-baseline.md
  # 语义：新增计数/超限文件未登记 → exit 1；提升基线必须显式 --update。
  governance-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-unwrap-baseline.mjs
      - run: node scripts/check-swallowed-errors.mjs
      - run: node scripts/check-crate-size.mjs

  # 桌面端守卫接线（check-guard-system 的 unwired_guard 收口）：
  # 下列门禁此前只在本地 `check:desktop` 聚合里跑，CI 未接线 →
  # 被 check-guard-system 判定为 unwired_guard 并阻塞全仓 pre-commit。
  # 已实测：这 19 条在本仓当前状态全部 exit 0，且**不依赖构建产物**（只读源码树），
  # 故安全接入中层（合并前全量验证）。
  # 仍未接入的 3 条（conex-db-size / token-ssot / tokens-all）当前**实测失败**，属存量债务；已登记在
  # scripts/check-guard-system.mjs 的 UNWIRED_ALLOWLIST（含具体违规位置与 owner 任务），
  # 修复后必须移出豁免并接入本 job。
  # （DEBT-09 收口 2026-10-20：原 6 条中的 color-ssot / line-width-ssot /
  # frontend-convergence 已实测 PASS，移出豁免并接入本 job。）
  desktop-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.6.2 && npm ci
      # 静态/契约类守卫（按域分组，便于定位失败）
      - run: node scripts/check-async-commands.mjs
      - run: node scripts/check-blocked-executable-ssot.mjs
      - run: node scripts/check-no-nonvision-dataurl.mjs
      - run: node scripts/check-no-pseudo-dispatch.mjs
      - run: node scripts/check-reflow-guards.mjs
      - run: node scripts/check-sec6-note-drain-entropy.mjs
      - run: node scripts/check-perf-budgets.mjs
      # 设计 Token / 样式契约类
      - run: node scripts/check-icon-ssot.mjs
      - run: node scripts/check-input-guardrails.mjs
      - run: node scripts/check-layout-geometry.mjs
      - run: node scripts/check-layout-tokens.mjs
      - run: node scripts/check-markdown-style-compliance.mjs
      - run: node scripts/check-preferences-ssot.mjs
      - run: node scripts/check-text-color-tokens.mjs
      - run: node scripts/check-tooltip-hygiene.mjs
      # Token SSOT / 样式收敛类（DEBT-09 收口 2026-10-20：三条已实测 PASS，
      # 从 check-guard-system UNWIRED_ALLOWLIST 移除并接入本 job）
      - run: node scripts/check-color-ssot.mjs
      - run: node scripts/check-line-width-ssot.mjs
      - run: node scripts/check-frontend-convergence.mjs
      # 架构 / SSOT 类
      - run: node scripts/check-store-islands.mjs
      - run: node scripts/check-provider-single-track.mjs
      - run: node scripts/check-thinking-vocabulary-ssot.mjs
      - run: node scripts/check-source-assets-tracked.mjs
      # 会话/协作不变量门禁（GAP-08 收口，2026-10-20）：
      # 这 4 条此前只在 .husky/pre-commit 跑，使用 --no-verify、GitHub Web 编辑、
      # merge commit 或其他 agent 直推时可绕过，冲突标记可能进主分支。
      # 均为只读源码树扫描、不依赖构建产物，实测 exit 0，故接入中层作为兜底
      # （pre-commit 仍保留，作为快速反馈的第一道）。
      - run: node scripts/check-conflict-markers.mjs
      - run: node scripts/check-session-message-upsert.mjs
      - run: node scripts/check-tool-pairing-invariants.mjs
      - run: node scripts/check-db-write-bypass.mjs
