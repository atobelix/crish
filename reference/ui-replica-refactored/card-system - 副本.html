<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Stack System v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#fafafa;height:100vh;width:100vw;overflow:hidden;color:#3a3a38;-webkit-font-smoothing:antialiased}
button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit;outline:none;padding:0;user-select:none}
input{outline:none;border:none;background:none;font-family:inherit}

/* ── Navbar ── */
.navbar{height:40px;background:#f7f7f7;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(0,0,0,.05);flex-shrink:0;position:relative;z-index:1000}
.nav-title{font-size:13px;font-weight:500;color:#666}
.nav-actions{display:flex;align-items:center;gap:8px}
.nav-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#999;transition:background .12s}
.nav-btn:hover{background:rgba(0,0,0,.04);color:#666}
.nav-btn svg{width:15px;height:15px}

/* ── Dropdown ── */
.dropdown-wrap{position:relative}
.dropdown-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:1001;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:4px;min-width:140px;display:none;flex-direction:column;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.dropdown-menu.show{display:flex}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:12px;color:#3a3a38;border-radius:6px;cursor:pointer;min-height:26px;transition:background .12s}
.dropdown-item:hover{background:rgba(0,0,0,.04)}
.dropdown-item svg{width:13px;height:13px;color:#999;flex-shrink:0}

/* ── Main Layout ── */
.app-main{display:flex;height:calc(100vh - 40px);position:relative}
.main-panel{flex:1;min-width:200px;background:#fff;overflow-y:auto;padding:24px;position:relative}
.content-area{max-width:720px;margin:0 auto}
.content-area h2{font-size:18px;font-weight:600;margin-bottom:8px;color:#3a3a38}
.content-area p{font-size:14px;line-height:1.6;color:#666;margin-bottom:12px}

/* ── Card Area ── */
.card-area{display:flex;overflow:auto;background:#fff;border-left:1px solid rgba(0,0,0,.05);position:relative;min-width:0}
.card-area.hidden{display:none}

/* ── Column ── */
.card-column{display:flex;flex-direction:column;min-height:0;position:relative;width:320px;flex-shrink:0}
.col-resizer{width:4px;background:transparent;cursor:col-resize;flex-shrink:0;transition:background .15s;position:relative;z-index:10}
.col-resizer:hover{background:rgba(0,0,0,.06)}
.col-resizer.dragging{background:rgba(0,0,0,.12)}

/* ── Card ── */
.card{border:1px solid rgba(0,0,0,.05);border-radius:8px;background:#fff;display:flex;flex-direction:column;min-height:120px;min-width:200px;position:relative;overflow:hidden;flex-shrink:0;transition:none}
.card.drag-placeholder{opacity:.25}
.card.drop-target{border-color:#0084ff;box-shadow:0 0 0 1.5px rgba(0,132,255,.15)}

/* ── Drag ghost (clone with dragging class) ── */
.card.dragging{position:fixed!important;pointer-events:none;z-index:9999;border-color:rgba(0,0,0,.1);box-shadow:0 12px 40px rgba(0,0,0,.12);opacity:.92;transition:none}
.card.dragging .card-body{max-height:200px;overflow:hidden}

/* ── Tab Drag Ghost ── */
.tab-ghost{position:fixed;pointer-events:none;z-index:10000;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:5px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:3px 10px;font-size:12px;color:#3a3a38;white-space:nowrap}

/* ── Snap Indicator ── */
.snap-indicator{position:fixed;pointer-events:none;z-index:9998;border:2px solid #0084ff;border-radius:8px;background:rgba(0,132,255,.04);opacity:0;transition:opacity .1s}
.snap-indicator.show{opacity:1}
.snap-indicator.right{border-color:#10b981;background:rgba(16,185,129,.04)}
.snap-indicator.left{border-color:#8b5cf6;background:rgba(139,92,246,.04)}

/* ── Card Header ── */
.card-header{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;border-bottom:1px solid rgba(0,0,0,.04);background:#fff;cursor:grab;flex-shrink:0;user-select:none}
.card-header:active{cursor:grabbing}
.card-tabs{display:flex;align-items:center;gap:2px;flex:1;overflow:hidden;min-width:0}
.card-tab{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;color:#999;border-radius:4px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.card-tab:hover{background:rgba(0,0,0,.04);color:#666}
.card-tab.active{color:#1a1a1a;background:rgba(0,0,0,.04);font-weight:500}
.card-tab .tab-close{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;opacity:0;transition:opacity .12s;font-size:11px;line-height:1;color:#bbb}
.card-tab:hover .tab-close{opacity:1}
.card-tab .tab-close:hover{background:rgba(0,0,0,.06);color:#999}
.card-tab.dragging{opacity:.3}

/* ── Card Header Right ── */
.card-hdr{display:flex;align-items:center;gap:1px;flex-shrink:0;margin-left:4px}
.hdr-btn{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#bbb;transition:background .12s,color .12s;font-size:12px}
.hdr-btn:hover{background:rgba(0,0,0,.04);color:#666}
.hdr-btn svg{width:11px;height:11px}

/* ── New Tab Btn ── */
.new-tab-btn{width:16px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:#bbb;font-size:13px;flex-shrink:0;transition:background .12s}
.new-tab-btn:hover{background:rgba(0,0,0,.04);color:#666}

/* ── Card Body ── */
.card-body{flex:1;overflow:auto;padding:14px;font-size:13px;color:#666;line-height:1.6;min-height:0}
.card-body .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#ccc;font-size:12px}

/* ── Row Resizer ── */
.row-resizer{height:4px;background:transparent;cursor:row-resize;flex-shrink:0;transition:background .15s;position:relative;z-index:10}
.row-resizer:hover{background:rgba(0,0,0,.06)}
.row-resizer.dragging{background:rgba(0,0,0,.12)}

/* ── Empty State ── */
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#bbb;font-size:13px;padding:20px}

/* ── Dark ── */
body.dark{background:#0a0a0a}
body.dark .navbar{background:#171717;border-color:rgba(255,255,255,.04)}
body.dark .nav-title{color:#a3a3a3}
body.dark .main-panel{background:#0a0a0a}
body.dark .content-area h2{color:#ededed}
body.dark .content-area p{color:#a3a3a3}
body.dark .card-area{background:#0a0a0a;border-color:rgba(255,255,255,.05)}
body.dark .card,.drag-overlay{background:#1a1a1a;border-color:rgba(255,255,255,.06)}
body.dark .card-header{background:#1a1a1a;border-color:rgba(255,255,255,.04)}
body.dark .card-body{color:#aaa}
body.dark .card-tab{color:#888}
body.dark .card-tab:hover{background:rgba(255,255,255,.05);color:#ccc}
body.dark .card-tab.active{color:#ededed;background:rgba(255,255,255,.08)}
body.dark .dropdown-menu{background:#181818;border-color:rgba(255,255,255,.08)}
body.dark .dropdown-item{color:#ccc}
body.dark .dropdown-item:hover{background:rgba(255,255,255,.06)}
body.dark .empty-state{color:#666}
</style>
</head>
<body>

<nav class="navbar">
  <span class="nav-title">卡片堆叠系统 v2</span>
  <div class="nav-actions">
    <div class="dropdown-wrap">
      <button class="nav-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      </button>
      <div class="dropdown-menu" id="cardDropdown">
        <div class="dropdown-item" data-type="note">📝 笔记</div>
        <div class="dropdown-item" data-type="todo">✅ 待办</div>
        <div class="dropdown-item" data-type="chart">📊 图表</div>
        <div class="dropdown-item" data-type="code">💻 代码</div>
        <div class="dropdown-sep" style="height:1px;background:rgba(0,0,0,.04);margin:3px 6px"></div>
        <div class="dropdown-item" data-type="clear">🗑 清空所有</div>
      </div>
    </div>
    <button class="nav-btn" id="themeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</nav>

<div class="app-main">
  <div class="main-panel" id="mainPanel">
    <div class="content-area">
      <h2>卡片堆叠系统</h2>
      <p>点击右上角 <strong>+</strong> 添加卡片。拖拽卡片头部移动位置。拖拽标签页到外部创建新卡片。</p>
      <p>卡片支持无极缩放、拖拽排序、标签页管理、边缘吸附。</p>
      <div style="border:1px solid rgba(0,0,0,.04);border-radius:8px;padding:16px;background:#fafafa;margin-top:16px">
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" placeholder="输入内容..." style="flex:1;border:1px solid rgba(0,0,0,.06);border-radius:6px;padding:8px 10px;font-size:13px;color:#3a3a38;background:#fff;">
          <button style="padding:8px 14px;background:rgba(0,0,0,.04);border-radius:6px;font-size:12px;color:#666;">发送</button>
        </div>
      </div>
      <div class="flow-items" style="margin-top:16px">
        <div class="flow-item" style="background:#fafafa;border-radius:8px;padding:16px;margin-bottom:10px;border:1px solid rgba(0,0,0,.04)"><h3 style="font-size:14px;font-weight:600;margin-bottom:4px;color:#3a3a38">项目概览</h3><p style="font-size:13px;color:#666;line-height:1.5">当前项目卡片区域位于右侧。你可以自由打开、拖拽和排列卡片。</p></div>
        <div class="flow-item" style="background:#fafafa;border-radius:8px;padding:16px;margin-bottom:10px;border:1px solid rgba(0,0,0,.04)"><h3 style="font-size:14px;font-weight:600;margin-bottom:4px;color:#3a3a38">拖拽交互说明</h3><p style="font-size:13px;color:#666;line-height:1.5">拖拽卡片头部→移动卡片；拖拽标签页→外拉创建新卡片；右下角区域→缩放卡片。</p></div>
      </div>
    </div>
  </div>

  <div class="card-area" id="cardArea">
    <div class="empty-state" id="emptyState">点击 + 添加卡片面板</div>
  </div>
</div>

<div class="snap-indicator" id="snapIndicator"></div>

<script>
/* ═══════════════════════════════════
   State
   ═══════════════════════════════════ */
let cards = [];
let columns = [];
let idCounter = 0;

let dragState = null;      // { card, cardEl, overlay, startX, startY }
let tabDragState = null;   // { tab, fromCard, clone, offsetX/Y }
let resizeState = null;    // { card, nextCard, cardEl, nextEl, startY, startH, nextH, resizer }
let colResizeState = null; // { colIdx, startX, startWidth, nextWidth, resizer }

const SNAP = 80;
const COLS_PER_PAGE = 2;

/* ═══════════════════════════════════
   Card Factory
   ═══════════════════════════════════ */
const sampleContents = {
  note: ['📝 笔记','<h4 style="font-weight:600;font-size:14px;color:#1a1a1a;margin-bottom:6px">笔记卡片</h4><p>自由记录想法、灵感或重要信息。支持拖拽标签页到其他卡片。</p>'],
  todo: ['✅ 待办','<h4 style="font-weight:600;font-size:14px;color:#1a1a1a;margin-bottom:6px">待办事项</h4><p style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="width:12px;height:12px;border:1px solid #ddd;border-radius:3px"></span>完成项目文档</p><p style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="width:12px;height:12px;border:1px solid #ddd;border-radius:3px"></span>回复客户邮件</p>'],
  chart: ['📊 图表','<h4 style="font-weight:600;font-size:14px;color:#1a1a1a;margin-bottom:6px">数据图表</h4><p>图表展示区域，可嵌入各种可视化组件。</p><div style="height:60px;background:linear-gradient(90deg,#3b82f6,#10b981);border-radius:4px;opacity:.15;margin-top:8px"></div>'],
  code: ['💻 代码','<pre style="background:rgba(0,0,0,.02);border:1px solid rgba(0,0,0,.04);border-radius:6px;padding:12px;font-size:12px;line-height:1.5;overflow-x:auto;color:#444"><code>function hello() {\n  console.log("Card Stack System");\n  return "v2";\n}</code></pre>']
};

function createCard(type = 'note', tabTitle) {
  const id = 'c' + (++idCounter);
  const content = sampleContents[type] || sampleContents.note;
  const tab = { id: id + '-t1', type, title: tabTitle || content[0], active: true };
  const card = { id, tabs: [tab], height: null, columnIndex: 0, rowIndex: 0 };
  cards.push(card);
  recalcLayout();
  render();
}

function clearAllCards() { cards = []; columns = []; render(); }

/* ═══════════════════════════════════
   Layout
   ═══════════════════════════════════ */
function recalcLayout() {
  if (!cards.length) { columns = []; return; }
  columns = [];
  for (let i = 0; i < cards.length; i++) {
    const colIdx = Math.floor(i / COLS_PER_PAGE);
    const rowIdx = i % COLS_PER_PAGE;
    if (!columns[colIdx]) columns[colIdx] = { cards: [], width: 320 };
    columns[colIdx].cards.push(cards[i]);
    cards[i].columnIndex = colIdx;
    cards[i].rowIndex = rowIdx;
  }
}

/* ═══════════════════════════════════
   Render
   ═══════════════════════════════════ */
function render() {
  const area = document.getElementById('cardArea');
  const empty = document.getElementById('emptyState');
  area.innerHTML = '';

  if (!cards.length) {
    area.appendChild(empty);
    area.style.borderLeft = 'none';
    return;
  }
  area.style.borderLeft = '1px solid rgba(0,0,0,.05)';

  columns.forEach((col, ci) => {
    const colEl = document.createElement('div');
    colEl.className = 'card-column';
    colEl.style.width = col.width + 'px';

    col.cards.forEach((card, ri) => {
      const el = createCardElement(card);
      colEl.appendChild(el);
      if (ri < col.cards.length - 1) {
        const rz = document.createElement('div');
        rz.className = 'row-resizer';
        rz.addEventListener('pointerdown', (e) => startRowResize(e, card, ci));
        colEl.appendChild(rz);
      }
    });
    area.appendChild(colEl);

    if (ci < columns.length - 1) {
      const cr = document.createElement('div');
      cr.className = 'col-resizer';
      cr.addEventListener('pointerdown', (e) => startColResize(e, ci));
      area.appendChild(cr);
    }
  });
}

function createCardElement(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.cardId = card.id;
  el.style.flex = card.height ? 'none' : '1';
  if (card.height) el.style.height = card.height + 'px';

  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.addEventListener('pointerdown', (e) => startCardDrag(e, card));

  // Tabs
  const tabs = document.createElement('div');
  tabs.className = 'card-tabs';
  card.tabs.forEach(t => {
    const tb = document.createElement('div');
    tb.className = 'card-tab' + (t.active ? ' active' : '');
    tb.innerHTML = `<span>${t.title}</span><span class="tab-close">×</span>`;
    tb.dataset.tabId = t.id;
    tb.addEventListener('click', (e) => {
      if (e.target.closest('.tab-close')) {
        card.tabs = card.tabs.filter(ct => ct.id !== t.id);
        if (!card.tabs.length) { cards = cards.filter(c => c.id !== card.id); recalcLayout(); render(); return; }
        if (t.active && card.tabs.length) card.tabs[0].active = true;
        render(); return;
      }
      if (!tabDragState) {
        card.tabs.forEach(ct => ct.active = ct.id === t.id);
        render();
      }
    });
    tb.addEventListener('pointerdown', (e) => startTabDrag(e, t, card));
    tabs.appendChild(tb);
  });

  const newTab = document.createElement('button');
  newTab.className = 'new-tab-btn';
  newTab.textContent = '+';
  newTab.addEventListener('click', (e) => { e.stopPropagation();
    const types = Object.keys(sampleContents);
    const t = types[Math.floor(Math.random() * types.length)];
    const id = 't' + (++idCounter);
    card.tabs.forEach(ct => ct.active = false);
    card.tabs.push({ id, type: t, title: sampleContents[t][0], active: true });
    render();
  });
  tabs.appendChild(newTab);
  hdr.appendChild(tabs);

  const hdrRight = document.createElement('div');
  hdrRight.className = 'card-hdr';
  const exp = document.createElement('button');
  exp.className = 'hdr-btn'; exp.innerHTML = '⛶'; exp.title = '展开';
  exp.addEventListener('click', (e) => { e.stopPropagation();
    card.height = card.height ? null : 400;
    render();
  });
  const cls = document.createElement('button');
  cls.className = 'hdr-btn'; cls.innerHTML = '×'; cls.title = '关闭';
  cls.addEventListener('click', (e) => { e.stopPropagation();
    cards = cards.filter(c => c.id !== card.id);
    recalcLayout(); render();
  });
  hdrRight.appendChild(exp); hdrRight.appendChild(cls);
  hdr.appendChild(hdrRight);
  el.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'card-body';
  const active = card.tabs.find(t => t.active);
  body.innerHTML = active ? (sampleContents[active.type]?.[1] || '<p>空面板</p>') : '<p>空面板</p>';
  el.appendChild(body);

  return el;
}

/* ═══════════════════════════════════
   Card Drag (cloneNode approach)
   ═══════════════════════════════════ */
function startCardDrag(e, card) {
  if (e.target.closest('.card-tab') || e.target.closest('.hdr-btn') || e.target.closest('.new-tab-btn')) return;
  e.preventDefault();

  const el = document.querySelector(`[data-card-id="${card.id}"]`);
  const rect = el.getBoundingClientRect();

  // Clone the card element directly (mirrors reference implementation)
  const ghost = el.cloneNode(true);
  ghost.classList.add('dragging');
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);

  el.classList.add('drag-placeholder');

  dragState = {
    card, cardEl: el, ghost,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    startX: e.clientX, startY: e.clientY
  };
}

/* ═══════════════════════════════════
   Tab Drag
   ═══════════════════════════════════ */
function startTabDrag(e, tab, card) {
  if (e.target.closest('.tab-close')) return;
  e.preventDefault();
  e.stopPropagation();

  const rect = e.currentTarget.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'tab-ghost';
  ghost.textContent = tab.title;
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);

  e.currentTarget.classList.add('dragging');

  tabDragState = { tab, fromCard: card, ghost, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
}

/* ═══════════════════════════════════
   Row / Col Resize
   ═══════════════════════════════════ */
function startRowResize(e, card, colIdx) {
  e.preventDefault();
  const col = columns[colIdx];
  const idx = col.cards.indexOf(card);
  const next = col.cards[idx + 1];
  if (!next) return;
  const ce = document.querySelector(`[data-card-id="${card.id}"]`);
  const ne = document.querySelector(`[data-card-id="${next.id}"]`);
  e.currentTarget.classList.add('dragging');
  resizeState = { card, nextCard: next, cardEl: ce, nextEl: ne, startY: e.clientY, startH: ce.offsetHeight, nextH: ne.offsetHeight, resizer: e.currentTarget };
}

function startColResize(e, colIdx) {
  e.preventDefault();
  const col = columns[colIdx];
  const next = columns[colIdx + 1];
  if (!next) return;
  e.currentTarget.classList.add('dragging');
  colResizeState = { colIdx, startX: e.clientX, startW: col.width, nextW: next.width, resizer: e.currentTarget };
}

/* ═══════════════════════════════════
   Global Pointer Events
   ═══════════════════════════════════ */
document.addEventListener('pointermove', (e) => {
  if (dragState) {
    const ds = dragState;
    ds.ghost.style.left = (e.clientX - ds.offsetX) + 'px';
    ds.ghost.style.top = (e.clientY - ds.offsetY) + 'px';
    showSnap(e.clientX, e.clientY);
    return;
  }
  if (tabDragState) {
    const ts = tabDragState;
    ts.ghost.style.left = (e.clientX - ts.offsetX) + 'px';
    ts.ghost.style.top = (e.clientY - ts.offsetY) + 'px';
    // Highlight drop targets
    document.querySelectorAll('.card').forEach(el => {
      const r = el.getBoundingClientRect();
      el.classList.toggle('drop-target', e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
    });
    return;
  }
  if (resizeState) {
    const rs = resizeState;
    const dy = e.clientY - rs.startY;
    const h = Math.max(80, rs.startH + dy);
    const nh = Math.max(80, rs.nextH - dy);
    rs.cardEl.style.flex = 'none'; rs.cardEl.style.height = h + 'px';
    rs.nextEl.style.flex = 'none'; rs.nextEl.style.height = nh + 'px';
    return;
  }
  if (colResizeState) {
    const cs = colResizeState;
    const dx = e.clientX - cs.startX;
    const w = Math.max(200, cs.startW + dx);
    const nw = Math.max(200, cs.nextW - dx);
    columns[cs.colIdx].width = w;
    columns[cs.colIdx + 1].width = nw;
    const els = document.querySelectorAll('.card-column');
    if (els[cs.colIdx]) els[cs.colIdx].style.width = w + 'px';
    if (els[cs.colIdx + 1]) els[cs.colIdx + 1].style.width = nw + 'px';
    return;
  }
});

document.addEventListener('pointerup', (e) => {
  if (dragState) {
    const ds = dragState;
    ds.ghost.remove();
    ds.cardEl.classList.remove('drag-placeholder');

    const dropColEls = document.querySelectorAll('.card-column');
    let dropped = false;
    dropColEls.forEach((colEl, ci) => {
      const r = colEl.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        moveCardToColumn(ds.card, ci);
        dropped = true;
      }
    });

    if (!dropped) {
      const snapZone = getSnapZone(e.clientX, e.clientY);
      if (snapZone) {
        if (snapZone.zone === 'right') moveCardToNewColumn(ds.card, columns.length);
        else if (snapZone.zone === 'left') moveCardToNewColumn(ds.card, 0);
        else moveCardToNewColumn(ds.card, columns.length);
      } else {
        moveCardToNewColumn(ds.card, columns.length);
      }
    }

    dragState = null;
    hideSnap();
    recalcLayout();
    render();
    return;
  }

  if (tabDragState) {
    const ts = tabDragState;
    // Remove the dragging class from the original tab
    document.querySelectorAll('.card-tab.dragging').forEach(el => el.classList.remove('dragging'));
    // Find target card
    let target = null;
    document.querySelectorAll('.card').forEach(el => {
      el.classList.remove('drop-target');
      const r = el.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        target = cards.find(c => c.id === el.dataset.cardId);
      }
    });
    if (target && target.id !== ts.fromCard.id) {
      ts.fromCard.tabs = ts.fromCard.tabs.filter(t => t.id !== ts.tab.id);
      if (!ts.fromCard.tabs.length) { cards = cards.filter(c => c.id !== ts.fromCard.id); }
      else if (!ts.fromCard.tabs.some(t => t.active)) ts.fromCard.tabs[0].active = true;
      target.tabs.forEach(t => t.active = false);
      ts.tab.active = true;
      target.tabs.push(ts.tab);
    } else if (!target) {
      // Create new card from tab
      const types = Object.keys(sampleContents);
      const t = sampleContents[ts.tab.type] ? ts.tab.type : 'note';
      ts.fromCard.tabs = ts.fromCard.tabs.filter(ct => ct.id !== ts.tab.id);
      if (!ts.fromCard.tabs.length) { cards = cards.filter(c => c.id !== ts.fromCard.id); }
      else if (!ts.fromCard.tabs.some(ct => ct.active)) ts.fromCard.tabs[0].active = true;

      const card = { id: 'c' + (++idCounter), tabs: [{ ...ts.tab, active: true }], height: null };
      cards.push(card);
    }
    ts.ghost.remove();
    tabDragState = null;
    recalcLayout();
    render();
    return;
  }

  if (resizeState) { resizeState.resizer.classList.remove('dragging'); resizeState = null; recalcLayout(); render(); return; }
  if (colResizeState) { colResizeState.resizer.classList.remove('dragging'); colResizeState = null; recalcLayout(); render(); return; }
});

/* ═══════════════════════════════════
   Card Movement
   ═══════════════════════════════════ */
function moveCardToColumn(card, colIdx) {
  cards = cards.filter(c => c.id !== card.id);
  let insertAt = 0;
  for (let i = 0; i < cards.length; i++) if (cards[i].columnIndex === colIdx) insertAt = i + 1;
  cards.splice(insertAt, 0, card);
}

function moveCardToNewColumn(card, pos) {
  cards = cards.filter(c => c.id !== card.id);
  if (pos === 0) cards.unshift(card); else cards.push(card);
}

/* ═══════════════════════════════════
   Snap
   ═══════════════════════════════════ */
function showSnap(x, y) {
  const s = document.getElementById('snapIndicator');
  const z = getSnapZone(x, y);
  if (z) {
    s.style.left = z.rect.left + 'px'; s.style.top = z.rect.top + 'px';
    s.style.width = z.rect.width + 'px'; s.style.height = z.rect.height + 'px';
    s.className = 'snap-indicator show' + (z.zone === 'right' ? ' right' : z.zone === 'left' ? ' left' : '');
  } else { s.classList.remove('show'); }
}
function hideSnap() { document.getElementById('snapIndicator').classList.remove('show'); }

function getSnapZone(x, y) {
  const vw = window.innerWidth, vh = window.innerHeight, nb = 40;
  if (y < nb + SNAP) return { zone: 'top', rect: { left: 0, top: nb, width: vw, height: vh * 0.4 } };
  if (y > vh - SNAP) return { zone: 'bottom', rect: { left: 0, top: vh * 0.6, width: vw, height: vh * 0.4 } };
  if (x < SNAP) return { zone: 'left', rect: { left: 0, top: nb, width: vw * 0.35, height: vh - nb } };
  if (x > vw - SNAP) return { zone: 'right', rect: { left: vw * 0.65, top: nb, width: vw * 0.35, height: vh - nb } };
  return null;
}

/* ═══════════════════════════════════
   Menu + Theme
   ═══════════════════════════════════ */
document.getElementById('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('cardDropdown').classList.toggle('show'); });
document.addEventListener('click', () => document.getElementById('cardDropdown').classList.remove('show'));
document.querySelectorAll('.dropdown-item[data-type]').forEach(item => {
  item.addEventListener('click', () => {
    const t = item.dataset.type;
    if (t === 'clear') clearAllCards();
    else createCard(t);
    document.getElementById('cardDropdown').classList.remove('show');
  });
});

document.getElementById('themeBtn').addEventListener('click', () => document.body.classList.toggle('dark'));

// Escape cancels drag
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (dragState) { dragState.ghost.remove(); dragState.cardEl.classList.remove('drag-placeholder'); dragState = null; hideSnap(); }
    if (tabDragState) { tabDragState.ghost.remove(); document.querySelectorAll('.card-tab.dragging').forEach(el => el.classList.remove('dragging')); tabDragState = null; }
  }
});

// Initial card
createCard('note', '📝 快速笔记');
</script>
