[workspace]
members = [
    "apps/agent-workbench/src-tauri",
    "crates/agent-provider",
    "crates/agent-tools",
    "crates/conex-browser",
    "crates/conex-browser-tools",
    "crates/conex-compaction",
    "crates/conex-computer",
    "crates/conex-computer-tools",
    "crates/conex-db",
    "crates/conex-diff",
    "crates/conex-doc-collab",
    "crates/conex-fs",
    "crates/conex-markdown",
    "crates/conex-md-ast",
    "crates/conex-workspace-store",
    "crates/conex-note-runtime",
    "crates/conex-relay",
    "crates/conex-sandbox",
    "crates/conex-search",
    "crates/conex-shared",
    "crates/conex-telemetry",
    "crates/conex-test-utils",
    "crates/conex-types",
    "crates/orchestrator",
    "crates/session-loop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Conex Community"]
description = "Crish — Tauri desktop AI agent workbench (Rust engine, React UI)"
repository = "https://github.com/conex-community/crish"

# workspace 级 lint 基线：子 crate 通过 [lints] workspace = true 继承。
# 选择依据与豁免记录见 docs/multi-agent-repair/基线记录/clippy-workspace-T13.md：
# - 不开 pedantic/nursery/restriction：存量告警约 200 条（多为 T1 清理遗留 dead_code），
#   一次性全开会爆量，后续轮次按 crate 增量打开；
# - 不开 unwrap_used/expect_used：存量 unwrap 1900+ 处，开启将全量炸开，先记录后治理；
# - unsafe_code = warn：让存量 unsafe 全部可见，逐处评审后降量；
# - dbg_macro / unimplemented 存量命中为 0，直接 deny 做正向守门。
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
# 组声明统一 priority = -1，保证具体 lint（dbg_macro/unimplemented）可覆盖组默认值
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
restriction = { level = "allow", priority = -1 }
dbg_macro = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = { version = "2", features = [] }
# reqwest 0.13：与 tauri 2.11 依赖链（0.13.4）收敛单版本，消除双 HTTP/hyper 栈。
# rustls 组（= rustls-ring）为 0.13 新增命名，旧名 rustls-tls 已弃用。
# http2 feature：D1 §3.3 连接配置（h2 PING 静默挂起对抗，http2_keep_alive_*
# builder 方法面；不支持 h2 的 provider 自动协商 h1.1，设置无效但不报错）。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "http2"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
# tokio 最小 feature 集（PE-10 T10.3）：按各 crate 实际使用面收敛（详见 AA-08 #3）。
# 各 crate 按需在依赖处补 feature：agent-provider 补 test-util/rt-multi-thread（dev），
# orchestrator dev 补 rt-multi-thread（persist.rs 测试用 Runtime::new）。
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "net", "io-util", "process"] }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = { version = "8", features = [] }
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
regex = "1"
similar = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
# markdown-rs：Conex-MD 契约层 GFM P 基座（conex-md-ast 唯一权威 parse；S 仍自研）
markdown = "1.0.0"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ammonia = "4"
moka = { version = "0.12", features = ["sync"] }
once_cell = "1"
# windows-sys：与 tauri 生态（windows 0.61）对齐的版本；各 crate 按需补 feature
windows-sys = { version = "0.61", features = [] }
# G5 清理（2026-08-03）：uuid 当前唯一消费者 agent-provider 处于并行域开发中
# （models/ 目录接线中），保留 workspace 声明供其按需加回；后续无消费者则删。
uuid = "1"
# Criterion 基准（PE-09 T09.7：仅 dev-dependency，不进常规测试路径；
# 依赖增量按 PE-10 修订指令 2 由本任务落声明）
criterion = "0.5"
