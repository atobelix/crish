<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conex IDE Workbench - Skeleton Screen</title>
  <style>
    /* --- CONEX UI DESIGN TOKENS & CSS VARIABLES --- */
    :root[data-theme="dark"] {
      --bg-primary: #141414;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #222222;
      --bg-card: #1e1e1e;
      --bg-elevated: #252525;
      --bg-hover: rgba(255, 255, 255, 0.05);
      --bg-active: rgba(255, 255, 255, 0.08);
      
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #666666;
      
      --border-color: #2a2a2a;
      --border-subtle: #222222;
      --hairline-strong: #333333;
      
      --accent-color: #3b82f6;
      --accent-green: #22c55e;
      --accent-green-bg: rgba(34, 197, 94, 0.12);
      --accent-orange: #f59e0b;
      --accent-orange-bg: rgba(245, 158, 11, 0.12);
      --accent-blue: #3b82f6;
      --accent-blue-bg: rgba(59, 130, 246, 0.12);
      
      --shimmer-base: rgba(255, 255, 255, 0.05);
      --shimmer-highlight: rgba(255, 255, 255, 0.13);
      --diff-add-bg: rgba(34, 197, 94, 0.08);
      --diff-del-bg: rgba(239, 68, 68, 0.08);
    }

    :root[data-theme="light"] {
      --bg-primary: hsl(35, 12%, 94%);
      --bg-secondary: hsl(35, 12%, 91.5%);
      --bg-tertiary: hsl(35, 12%, 88.5%);
      --bg-card: hsl(35, 10%, 98%);
      --bg-elevated: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.04);
      --bg-active: rgba(0, 0, 0, 0.08);
      
      --text-primary: #111111;
      --text-secondary: #555555;
      --text-tertiary: #888888;
      
      --border-color: hsl(35, 10%, 86%);
      --border-subtle: hsl(35, 8%, 91%);
      --hairline-strong: hsl(35, 10%, 80%);
      
      --accent-color: #1e40af;
      --accent-green: #15803d;
      --accent-green-bg: rgba(21, 128, 61, 0.1);
      --accent-orange: #d97706;
      --accent-orange-bg: rgba(217, 119, 6, 0.1);
      --accent-blue: #2563eb;
      --accent-blue-bg: rgba(37, 99, 235, 0.1);
      
      --shimmer-base: rgba(0, 0, 0, 0.06);
      --shimmer-highlight: rgba(0, 0, 0, 0.14);
      --diff-add-bg: rgba(34, 197, 94, 0.12);
      --diff-del-bg: rgba(239, 68, 68, 0.12);
    }

    /* --- RESET & LAYOUT CONTAINER --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
    }

    .app-workbench {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* --- TOP TITLEBAR / APP HEADER --- */
    .top-titlebar {
      height: 38px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .titlebar-left, .titlebar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .window-controls {
      display: flex;
      gap: 7px;
    }

    .win-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      opacity: 0.8;
    }
    .win-dot.close { background: #ff5f56; }
    .win-dot.min { background: #ffbd2e; }
    .win-dot.max { background: #27c93f; }

    .brand-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* --- MAIN 3-COLUMN LAYOUT --- */
    .workbench-body {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
    }

    /* --- COLUMN 1: LEFT SIDEBAR --- */
    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
      position: relative;
    }

    .sidebar-top {
      padding: 12px 10px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
    }

    /* --- COLUMN 2: MIDDLE CHAT & COMPOSER --- */
    .col-middle {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 320px;
      background: var(--bg-primary);
      border-right: 1px solid var(--border-color);
      position: relative;
    }

    .workspace-chrome-bar {
      height: 38px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      padding: 0 10px;
      gap: 6px;
      flex-shrink: 0;
    }

    .chrome-tab {
      height: 32px;
      padding: 0 12px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-bottom: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .chrome-tab.active {
      background: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }

    .composer-container {
      padding: 14px 20px 18px 20px;
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    .composer-shell {
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: var(--bg-card);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    /* --- COLUMN 3: RIGHT TOOLS / DIFF / TERMINAL PANE --- */
    .col-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 340px;
      background: var(--bg-primary);
      position: relative;
    }

    .card-panel-header {
      height: 38px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .card-tabs {
      display: flex;
      gap: 4px;
    }

    .card-tab-btn {
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-tab-btn.active {
      background: var(--bg-hover);
      color: var(--text-primary);
      font-weight: 500;
    }

    .split-panes-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pane-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-bottom: 1px solid var(--border-color);
    }

    .pane-section:last-child {
      border-bottom: none;
    }

    .pane-sub-header {
      height: 28px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border-color);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* --- SYNCHRONIZED SHIMMER ANIMATION --- */
    @keyframes skeletonShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .shimmer {
      background: linear-gradient(
        90deg,
        var(--shimmer-base) 25%,
        var(--shimmer-highlight) 50%,
        var(--shimmer-base) 75%
      );
      background-size: 200% 100%;
      animation: skeletonShimmer 1.8s ease-in-out infinite;
      border-radius: 4px;
    }

    /* --- SKELETON PLACEHOLDER ATOMS --- */
    .skel-pill {
      height: 22px;
      border-radius: 999px;
      display: inline-block;
    }

    .skel-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .skel-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .skel-line {
      height: 12px;
      border-radius: 3px;
      margin: 4px 0;
    }

    /* --- DIFF VIEW SPECIFICS --- */
    .diff-code-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
    }

    .diff-row {
      height: 22px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }
    .diff-row.add { background: var(--diff-add-bg); }
    .diff-row.del { background: var(--diff-del-bg); }

    .diff-num {
      width: 36px;
      color: var(--text-tertiary);
      text-align: right;
      padding-right: 8px;
      flex-shrink: 0;
    }

    /* --- TERMINAL SPECIFICS --- */
    .terminal-body {
      background: var(--bg-secondary);
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .term-prompt {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-green);
    }

    /* --- SPLITTER DIVIDERS --- */
    .col-splitter {
      width: 5px;
      cursor: col-resize;
      position: absolute;
      top: 0;
      bottom: 0;
      right: -3px;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="app-workbench">
  <!-- TOP TITLEBAR -->
  <header class="top-titlebar">
    <div class="titlebar-left">
      <div class="window-controls">
        <div class="win-dot close"></div>
        <div class="win-dot min"></div>
        <div class="win-dot max"></div>
      </div>
      <div class="brand-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        Conex Multi-Pane Split Workbench
      </div>
    </div>
    
    <div class="titlebar-right">
      <div class="shimmer skel-pill" style="width: 140px; height: 22px;"></div>
      <button class="theme-toggle-btn" onclick="toggleTheme()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        Toggle Theme
      </button>
    </div>
  </header>

  <!-- MAIN WORKBENCH BODY (3 COLUMNS) -->
  <main class="workbench-body">
    
    <!-- COLUMN 1: LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <!-- Project Selector Skeleton -->
        <div class="shimmer" style="height: 30px; border-radius: 6px; width: 100%;"></div>
        <!-- Search Bar & New Chat Skeleton -->
        <div style="display: flex; gap: 6px; margin-top: 4px;">
          <div class="shimmer" style="height: 28px; border-radius: 6px; flex: 1;"></div>
          <div class="shimmer skel-icon-btn" style="height: 28px; width: 28px;"></div>
        </div>
      </div>

      <!-- Session List Skeletons -->
      <div class="sidebar-scroll">
        <div style="font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; padding-left: 2px;">Recent Workspaces</div>
        
        <!-- Session Card Skeleton 1 (Active) -->
        <div style="padding: 8px; border-radius: 6px; background: var(--bg-hover); display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border-color);">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div class="shimmer skel-line" style="width: 70%; height: 13px;"></div>
            <div class="shimmer skel-pill" style="width: 32px; height: 16px;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <div class="shimmer skel-pill" style="width: 50px; height: 14px; background: var(--accent-blue-bg);"></div>
            <div class="shimmer skel-line" style="width: 40%; height: 10px;"></div>
          </div>
        </div>

        <!-- Session Card Skeleton 2 -->
        <div style="padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div class="shimmer skel-line" style="width: 80%; height: 12px;"></div>
          </div>
          <div class="shimmer skel-line" style="width: 45%; height: 10px;"></div>
        </div>

        <!-- Session Card Skeleton 3 -->
        <div style="padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div class="shimmer skel-line" style="width: 65%; height: 12px;"></div>
          </div>
          <div class="shimmer skel-line" style="width: 35%; height: 10px;"></div>
        </div>

        <!-- Session Card Skeleton 4 -->
        <div style="padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div class="shimmer skel-line" style="width: 75%; height: 12px;"></div>
          </div>
          <div class="shimmer skel-line" style="width: 50%; height: 10px;"></div>
        </div>
      </div>

      <!-- Sidebar Footer -->
      <footer class="sidebar-footer">
        <div class="shimmer skel-pill" style="width: 75px; height: 24px;"></div>
        <div style="display: flex; gap: 6px;">
          <div class="shimmer skel-icon-btn"></div>
          <div class="shimmer skel-icon-btn"></div>
        </div>
      </footer>
    </aside>

    <!-- COLUMN 2: MIDDLE CHAT & COMPOSER -->
    <section class="col-middle">
      <!-- Session Tabs / Chrome Bar -->
      <div class="workspace-chrome-bar">
        <div class="chrome-tab active">
          <div class="shimmer skel-line" style="width: 90px; height: 11px;"></div>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
        <div class="chrome-tab">
          <div class="shimmer skel-line" style="width: 70px; height: 11px;"></div>
        </div>
        <div class="shimmer skel-icon-btn" style="width: 24px; height: 24px; margin-bottom: 4px;"></div>
      </div>

      <!-- Chat Stream Messages -->
      <div class="chat-scroll-area">
        
        <!-- User Query Bubble Skeleton -->
        <div style="align-self: flex-end; max-width: 80%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="shimmer skel-avatar" style="width: 20px; height: 20px;"></div>
            <div class="shimmer skel-line" style="width: 60px; height: 10px;"></div>
          </div>
          <div class="shimmer skel-line" style="width: 280px; height: 13px;"></div>
        </div>

        <!-- Assistant Response Skeleton Card -->
        <div style="align-self: flex-start; width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 12px;">
          <!-- Model Header Pill -->
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="shimmer skel-avatar" style="background: var(--accent-blue);"></div>
            <div class="shimmer skel-pill" style="width: 110px; height: 20px; background: var(--accent-blue-bg);"></div>
            <div class="shimmer skel-pill" style="width: 70px; height: 18px;"></div>
          </div>

          <!-- Multi-line Text Shimmers -->
          <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
            <div class="shimmer skel-line" style="width: 94%; height: 13px;"></div>
            <div class="shimmer skel-line" style="width: 88%; height: 13px;"></div>
            <div class="shimmer skel-line" style="width: 65%; height: 13px;"></div>
            
            <!-- Embedded Tool Call Block Skeleton -->
            <div style="margin-top: 8px; border: 1px dashed var(--border-color); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-tertiary);">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div class="shimmer skel-icon-btn" style="width: 18px; height: 18px;"></div>
                <div class="shimmer skel-line" style="width: 140px; height: 11px;"></div>
              </div>
              <div class="shimmer skel-pill" style="width: 55px; height: 16px; background: var(--accent-green-bg);"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom Chat Composer Skeleton -->
      <div class="composer-container">
        <div class="composer-shell">
          <div class="shimmer skel-line" style="width: 40%; height: 14px;"></div>
          <div class="composer-actions">
            <div style="display: flex; gap: 8px;">
              <div class="shimmer skel-pill" style="width: 120px; height: 26px;"></div>
              <div class="shimmer skel-pill" style="width: 95px; height: 26px;"></div>
            </div>
            <div class="shimmer skel-pill" style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent-blue);"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- COLUMN 3: RIGHT TOOLS / DIFF / TERMINAL PANE -->
    <section class="col-right">
      <!-- Card Panel Header Tabs -->
      <div class="card-panel-header">
        <div class="card-tabs">
          <div class="card-tab-btn active">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 1-2 2v16a2 2 0 0 1 2 2h12a2 2 0 0 1 2-2V8z"/></svg>
            Diff View
          </div>
          <div class="card-tab-btn">Terminal</div>
          <div class="card-tab-btn">Files</div>
        </div>
        <div style="display: flex; gap: 6px;">
          <div class="shimmer skel-icon-btn" style="width: 22px; height: 22px;"></div>
          <div class="shimmer skel-icon-btn" style="width: 22px; height: 22px;"></div>
        </div>
      </div>

      <!-- Split Panes Container -->
      <div class="split-panes-container">
        
        <!-- PANE 1: FILE DIFF SKELETON -->
        <div class="pane-section">
          <div class="pane-sub-header">
            <span style="display: flex; align-items: center; gap: 6px;">
              <span class="shimmer skel-line" style="width: 130px; height: 10px;"></span>
            </span>
            <span class="shimmer skel-pill" style="width: 45px; height: 14px;"></span>
          </div>

          <div style="padding: 8px 0; flex: 1; overflow-y: auto;">
            <div class="diff-row">
              <div class="diff-num">12</div>
              <div class="shimmer skel-line" style="width: 70%; height: 11px; margin-left: 12px;"></div>
            </div>
            <div class="diff-row del">
              <div class="diff-num">13</div>
              <div class="shimmer skel-line" style="width: 55%; height: 11px; margin-left: 12px;"></div>
            </div>
            <div class="diff-row add">
              <div class="diff-num">13</div>
              <div class="shimmer skel-line" style="width: 80%; height: 11px; margin-left: 12px;"></div>
            </div>
            <div class="diff-row">
              <div class="diff-num">14</div>
              <div class="shimmer skel-line" style="width: 40%; height: 11px; margin-left: 12px;"></div>
            </div>
          </div>
        </div>

        <!-- PANE 2: TERMINAL CONSOLE SKELETON -->
        <div class="pane-section">
          <div class="pane-sub-header">
            <span>Terminal - zsh</span>
            <span style="color: var(--accent-green);">● Active</span>
          </div>

          <div class="terminal-body">
            <div class="term-prompt">
              <span>$</span>
              <div class="shimmer skel-line" style="width: 140px; height: 11px;"></div>
            </div>
            <div class="shimmer skel-line" style="width: 85%; height: 11px; opacity: 0.7;"></div>
            <div class="shimmer skel-line" style="width: 60%; height: 11px; opacity: 0.7;"></div>
            <div class="term-prompt" style="margin-top: 6px;">
              <span>$</span>
              <div class="shimmer skel-line" style="width: 18px; height: 13px; background: var(--text-primary);"></div>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  }
</script>

</body>
</html>
