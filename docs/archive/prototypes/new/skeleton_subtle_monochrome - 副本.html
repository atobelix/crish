<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conex Desktop - Ultra-Minimalist Swiss Typography & Soft Pulse Skeleton</title>
  <style>
    /* Modern CSS Reset & Swiss Typography System */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Dark Obsidian Palette */
      --bg-base: #0c0d10;
      --bg-surface: #16181d;
      --bg-elevated: #1c1f26;
      --border-subtle: #22252d;
      --border-light: #2e323d;
      --skeleton-base: #1b1e25;
      --skeleton-highlight: #2a2e39;
      --text-muted: #525866;

      /* Typography */
      --font-swiss: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-base);
      color: #e1e4ea;
      font-family: var(--font-swiss);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Silky Soft Breathing Pulse Keyframes */
    @keyframes softPulse {
      0%, 100% {
        opacity: 0.45;
        background-color: var(--skeleton-base);
      }
      50% {
        opacity: 0.9;
        background-color: var(--skeleton-highlight);
      }
    }

    .sk-box {
      animation: softPulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      border-radius: 4px;
      display: inline-block;
    }

    .sk-pill {
      border-radius: 9999px;
    }

    .sk-circle {
      border-radius: 50%;
    }

    /* App Layout Frame */
    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 1. Sidebar */
    .sidebar {
      width: 250px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
    }

    .sidebar-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-search-trigger {
      margin: 12px 12px 6px 12px;
      padding: 8px 10px;
      background-color: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-body {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      margin-bottom: 2px;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 6px;
    }

    .sidebar-footer {
      height: 52px;
      padding: 0 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 2. Workspace View */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-base);
      position: relative;
      min-width: 0;
    }

    /* Top Chrome Bar */
    .chrome-bar {
      height: 48px;
      padding: 0 20px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chrome-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chrome-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Message Stream Scroll Container */
    .message-stream {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 140px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stream-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Pinned Bar Banner */
    .pinned-banner {
      width: 100%;
      padding: 8px 14px;
      background: rgba(22, 24, 29, 0.75);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Chat Messages */
    .msg-row {
      display: flex;
      gap: 14px;
      width: 100%;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      flex-shrink: 0;
      padding-top: 2px;
    }

    .msg-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-bubble-sk {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px 16px 4px 16px;
      padding: 14px 16px;
      max-width: 82%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .code-card-sk {
      background-color: #121418;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .tool-chip-sk {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 380px;
      margin-top: 2px;
    }

    /* 3. Floating Bottom Composer */
    .composer-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 760px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .composer-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .composer-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .composer-submit {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="sk-box sk-circle" style="width: 22px; height: 22px;"></span>
          <span class="sk-box" style="width: 80px; height: 12px;"></span>
        </div>
        <span class="sk-box" style="width: 16px; height: 16px;"></span>
      </div>

      <div class="sidebar-search-trigger">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
          <span class="sk-box" style="width: 90px; height: 10px;"></span>
        </div>
        <span class="sk-box sk-pill" style="width: 28px; height: 14px;"></span>
      </div>

      <div class="sidebar-body">
        <!-- Section 1 -->
        <div class="sidebar-group">
          <div class="sidebar-group-title">
            <span class="sk-box" style="width: 64px; height: 9px; opacity: 0.6;"></span>
            <span class="sk-box" style="width: 12px; height: 12px; opacity: 0.6;"></span>
          </div>
          <div class="sidebar-nav-item">
            <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
            <span class="sk-box" style="width: 120px; height: 11px;"></span>
          </div>
          <div class="sidebar-nav-item">
            <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
            <span class="sk-box" style="width: 95px; height: 11px;"></span>
          </div>
          <div class="sidebar-nav-item">
            <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
            <span class="sk-box" style="width: 110px; height: 11px;"></span>
          </div>
        </div>

        <!-- Section 2 -->
        <div class="sidebar-group">
          <div class="sidebar-group-title">
            <span class="sk-box" style="width: 72px; height: 9px; opacity: 0.6;"></span>
          </div>
          <div class="sidebar-nav-item">
            <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
            <span class="sk-box" style="width: 135px; height: 11px;"></span>
          </div>
          <div class="sidebar-nav-item">
            <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
            <span class="sk-box" style="width: 105px; height: 11px;"></span>
          </div>
          <div class="sidebar-nav-item">
            <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
            <span class="sk-box" style="width: 88px; height: 11px;"></span>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <span class="sk-box sk-pill" style="width: 84px; height: 26px;"></span>
        <div style="display: flex; gap: 8px;">
          <span class="sk-box sk-circle" style="width: 20px; height: 20px;"></span>
          <span class="sk-box sk-circle" style="width: 20px; height: 20px;"></span>
        </div>
      </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="workspace">
      
      <!-- TOP CHROME HEADER -->
      <header class="chrome-bar">
        <div class="chrome-left">
          <span class="sk-box sk-circle" style="width: 18px; height: 18px;"></span>
          <span class="sk-box" style="width: 140px; height: 13px;"></span>
          <span class="sk-box sk-pill" style="width: 110px; height: 22px;"></span>
        </div>
        <div class="chrome-right">
          <span class="sk-box sk-pill" style="width: 70px; height: 22px;"></span>
          <span class="sk-box sk-circle" style="width: 20px; height: 20px;"></span>
          <span class="sk-box sk-circle" style="width: 20px; height: 20px;"></span>
        </div>
      </header>

      <!-- CHAT MESSAGE STREAM -->
      <div class="message-stream">
        <div class="stream-inner">
          
          <!-- Pinned Bar -->
          <div class="pinned-banner">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="sk-box sk-circle" style="width: 14px; height: 14px;"></span>
              <span class="sk-box" style="width: 180px; height: 11px;"></span>
            </div>
            <span class="sk-box" style="width: 12px; height: 12px;"></span>
          </div>

          <!-- Message 1: User -->
          <div class="msg-row user">
            <div class="msg-avatar">
              <span class="sk-box sk-circle" style="width: 28px; height: 28px;"></span>
            </div>
            <div class="user-bubble-sk">
              <span class="sk-box" style="width: 260px; height: 11px;"></span>
              <span class="sk-box" style="width: 180px; height: 11px;"></span>
            </div>
          </div>

          <!-- Message 2: Assistant -->
          <div class="msg-row">
            <div class="msg-avatar">
              <span class="sk-box sk-circle" style="width: 28px; height: 28px;"></span>
            </div>
            <div class="msg-body">
              <div class="msg-meta">
                <span class="sk-box" style="width: 70px; height: 12px;"></span>
                <span class="sk-box sk-pill" style="width: 60px; height: 16px;"></span>
              </div>
              <span class="sk-box" style="width: 92%; height: 11px;"></span>
              <span class="sk-box" style="width: 84%; height: 11px;"></span>
              <span class="sk-box" style="width: 68%; height: 11px;"></span>

              <!-- Tool call block -->
              <div class="tool-chip-sk">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="sk-box sk-circle" style="width: 12px; height: 12px;"></span>
                  <span class="sk-box" style="width: 140px; height: 10px;"></span>
                </div>
                <span class="sk-box sk-pill" style="width: 48px; height: 14px;"></span>
              </div>

              <!-- Code block silhouette -->
              <div class="code-card-sk">
                <span class="sk-box" style="width: 40%; height: 10px; opacity: 0.7;"></span>
                <span class="sk-box" style="width: 75%; height: 10px; opacity: 0.7;"></span>
                <span class="sk-box" style="width: 60%; height: 10px; opacity: 0.7;"></span>
              </div>
            </div>
          </div>

          <!-- Message 3: Assistant (typing/streaming response) -->
          <div class="msg-row">
            <div class="msg-avatar">
              <span class="sk-box sk-circle" style="width: 28px; height: 28px;"></span>
            </div>
            <div class="msg-body">
              <div class="msg-meta">
                <span class="sk-box" style="width: 70px; height: 12px;"></span>
              </div>
              <span class="sk-box" style="width: 88%; height: 11px;"></span>
              <span class="sk-box" style="width: 45%; height: 11px;"></span>
            </div>
          </div>

        </div>
      </div>

      <!-- FLOATING COMPOSER -->
      <div class="composer-dock">
        <div class="composer-main">
          <span class="sk-box" style="width: 280px; height: 13px;"></span>
        </div>
        <div class="composer-footer">
          <div class="composer-tools">
            <span class="sk-box sk-circle" style="width: 24px; height: 24px;"></span>
            <span class="sk-box sk-pill" style="width: 90px; height: 24px;"></span>
            <span class="sk-box sk-pill" style="width: 75px; height: 24px;"></span>
          </div>
          <div class="composer-submit">
            <span class="sk-box sk-circle" style="width: 28px; height: 28px;"></span>
          </div>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
