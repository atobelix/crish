<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONEX Workspace — Luxurious Minimal Skeleton Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── RESET & LUXURY DESIGN TOKENS ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-canvas: #09090b;
      --bg-sidebar: #0e0e11;
      --bg-card: #141417;
      --bg-elevated: #1a1a1e;
      --bg-inset: #0c0c0e;

      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(255, 255, 255, 0.18);

      --text-muted: #52525b;
      --text-secondary: #a1a1aa;
      --text-primary: #f4f4f5;

      --diff-add-bg: rgba(34, 197, 94, 0.07);
      --diff-add-border: rgba(34, 197, 94, 0.2);
      --diff-del-bg: rgba(239, 68, 68, 0.07);
      --diff-del-border: rgba(239, 68, 68, 0.2);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 9999px;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── SHIMMER & PULSE KEYFRAMES ─── */
    @keyframes luxShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes luxPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }

    .skel {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0.03) 100%
      );
      background-size: 200% 100%;
      animation: luxShimmer 2.4s ease-in-out infinite;
      border-radius: var(--radius-sm);
      display: inline-block;
    }

    .skel-pulse {
      animation: luxPulse 2s ease-in-out infinite;
    }

    /* ─── MAIN LAYOUT CONTAINER ─── */
    .app-viewport {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* ─── TOP CHROME TITLEBAR (44px) ─── */
    .top-chrome {
      height: 44px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
      user-select: none;
    }

    .chrome-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .window-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .workspace-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ws-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .ws-tab.active {
      background: var(--bg-canvas);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .chrome-center {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .breadcrumb-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
    }

    .chrome-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn-skel {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    /* ─── BODY CONTAINER (SIDEBAR + WORKSPACE CANVAS) ─── */
    .app-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ─── SIDEBAR (260px) ─── */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 12px 10px;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 34px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: var(--radius-md);
    }

    .session-group-title {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 12px 10px 4px 10px;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
    }

    .session-item.active {
      background: var(--bg-card);
      border-color: var(--border-subtle);
    }

    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    /* ─── WORKSPACE SPLIT CANVAS ─── */
    .workspace-canvas {
      flex: 1;
      display: flex;
      min-width: 0;
      background: var(--bg-canvas);
    }

    /* ─── CHAT PANE (55%) ─── */
    .chat-pane {
      flex: 55;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
      min-width: 0;
      position: relative;
    }

    .chat-header {
      height: 40px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-canvas);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      padding: 3px 9px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 120px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Message Rows */
    .msg-row-user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .user-bubble-skel {
      max-width: 78%;
      padding: 14px 18px;
      background: #18181c;
      border: 1px solid var(--border-subtle);
      border-radius: 18px 18px 4px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-row-assistant {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      max-width: 90%;
    }

    .assistant-avatar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .thought-card {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-execution-card {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .text-block-skel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .code-card-skel {
      width: 100%;
      background: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: 4px;
    }

    .code-card-header {
      height: 32px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .code-card-body {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--font-mono);
    }

    .code-line {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .line-num {
      width: 20px;
      color: var(--text-muted);
      font-size: 11px;
      text-align: right;
    }

    /* FLOATING CHAT COMPOSER */
    .composer-container {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 12px 14px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .composer-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar-left-chips {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-skel {
      height: 26px;
      padding: 0 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .send-btn-skel {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-strong);
    }

    /* ─── INSPECTION & DIFF PANE (45%) ─── */
    .diff-pane {
      flex: 45;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-canvas);
    }

    .diff-toolbar {
      height: 40px;
      padding: 0 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .source-seg {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 2px;
    }

    .seg-btn {
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
    }

    .diff-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diff-content-body {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* File List Sidebar (Collapsible) */
    .file-tree-sidebar {
      width: 180px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 10px 8px;
      gap: 6px;
      flex-shrink: 0;
    }

    .file-tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: var(--radius-md);
    }

    .file-tree-item.active {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    .status-badge {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
    }

    .status-m { background: rgba(234, 179, 8, 0.15); color: #eab308; }
    .status-a { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .status-d { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

    /* Code Diff Split Viewer */
    .diff-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      font-family: var(--font-mono);
    }

    .diff-chunk-header {
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
    }

    .diff-line {
      display: flex;
      align-items: center;
      min-height: 22px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .diff-line.del {
      background: var(--diff-del-bg);
      border-left: 2px solid var(--diff-del-border);
    }

    .diff-line.add {
      background: var(--diff-add-bg);
      border-left: 2px solid var(--diff-add-border);
    }

    .diff-line-num {
      width: 32px;
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
      user-select: none;
    }

    .diff-marker {
      width: 16px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .diff-marker.add { color: #22c55e; }
    .diff-marker.del { color: #ef4444; }
  </style>
</head>
<body>
  <div class="app-viewport">
    
    <!-- ─── TOP CHROME TITLEBAR ─── -->
    <header class="top-chrome">
      <div class="chrome-left">
        <div class="window-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="brand-pill">
          <span class="skel" style="width: 14px; height: 14px; border-radius: 3px;"></span>
          <span class="skel" style="width: 48px; height: 10px;"></span>
        </div>
        <div class="workspace-tabs">
          <div class="ws-tab active">
            <span class="skel" style="width: 8px; height: 8px; border-radius: 50%;"></span>
            <span class="skel" style="width: 64px; height: 10px;"></span>
          </div>
          <div class="ws-tab">
            <span class="skel" style="width: 12px; height: 12px;"></span>
          </div>
        </div>
      </div>

      <div class="chrome-center">
        <div class="breadcrumb-box">
          <span class="skel" style="width: 12px; height: 12px; border-radius: 50%;"></span>
          <span class="skel" style="width: 120px; height: 10px;"></span>
          <span class="skel" style="width: 1px; height: 10px; opacity: 0.3;"></span>
          <span class="skel" style="width: 52px; height: 10px; border-radius: 99px;"></span>
          <span class="skel" style="width: 74px; height: 10px; border-radius: 99px;"></span>
        </div>
      </div>

      <div class="chrome-right">
        <div class="icon-btn-skel skel"></div>
        <div class="icon-btn-skel skel"></div>
        <div class="icon-btn-skel skel"></div>
      </div>
    </header>

    <!-- ─── APP BODY ─── -->
    <div class="app-body">

      <!-- ─── LEFT SIDEBAR (260px) ─── -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <!-- Project Picker Dropdown -->
          <div class="project-picker">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="skel" style="width: 16px; height: 16px; border-radius: 4px;"></span>
              <span class="skel" style="width: 90px; height: 11px;"></span>
            </div>
            <span class="skel" style="width: 10px; height: 10px;"></span>
          </div>

          <!-- New Chat CTA -->
          <div class="new-chat-btn">
            <span class="skel" style="width: 12px; height: 12px;"></span>
            <span class="skel" style="width: 70px; height: 11px;"></span>
          </div>

          <!-- Quick Search -->
          <div class="search-box">
            <span class="skel" style="width: 12px; height: 12px;"></span>
            <span class="skel" style="width: 110px; height: 10px;"></span>
          </div>

          <!-- Nav Category Links -->
          <div class="sidebar-nav">
            <div class="nav-item">
              <span class="skel" style="width: 14px; height: 14px;"></span>
              <span class="skel" style="width: 60px; height: 11px;"></span>
            </div>
            <div class="nav-item">
              <span class="skel" style="width: 14px; height: 14px;"></span>
              <span class="skel" style="width: 50px; height: 11px;"></span>
            </div>
          </div>

          <!-- Sessions Section -->
          <div class="session-group-title">
            <span class="skel" style="width: 80px; height: 9px;"></span>
          </div>

          <div class="session-list">
            <!-- Active Session -->
            <div class="session-item active">
              <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                <span class="skel" style="width: 6px; height: 6px; border-radius: 50%; background: #22c55e;"></span>
                <span class="skel" style="width: 110px; height: 11px;"></span>
              </div>
              <span class="skel" style="width: 24px; height: 9px;"></span>
            </div>

            <!-- Inactive Sessions -->
            <div class="session-item">
              <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                <span class="skel" style="width: 6px; height: 6px; border-radius: 50%; opacity: 0.3;"></span>
                <span class="skel" style="width: 95px; height: 11px;"></span>
              </div>
              <span class="skel" style="width: 20px; height: 9px;"></span>
            </div>

            <div class="session-item">
              <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                <span class="skel" style="width: 6px; height: 6px; border-radius: 50%; opacity: 0.3;"></span>
                <span class="skel" style="width: 125px; height: 11px;"></span>
              </div>
              <span class="skel" style="width: 22px; height: 9px;"></span>
            </div>

            <div class="session-item">
              <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                <span class="skel" style="width: 6px; height: 6px; border-radius: 50%; opacity: 0.3;"></span>
                <span class="skel" style="width: 85px; height: 11px;"></span>
              </div>
              <span class="skel" style="width: 18px; height: 9px;"></span>
            </div>
          </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <div class="skel" style="width: 76px; height: 22px; border-radius: 99px;"></div>
          <div class="skel" style="width: 24px; height: 24px; border-radius: 50%;"></div>
        </div>
      </aside>

      <!-- ─── WORKSPACE SPLIT CANVAS ─── -->
      <main class="workspace-canvas">

        <!-- ─── CHAT PANE (55%) ─── -->
        <section class="chat-pane">
          <!-- Chat Filter Bar -->
          <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="skel" style="width: 14px; height: 14px;"></span>
              <span class="skel" style="width: 80px; height: 11px;"></span>
            </div>
            <div class="filter-pills">
              <div class="pill-btn"><span class="skel" style="width: 24px; height: 9px;"></span></div>
              <div class="pill-btn"><span class="skel" style="width: 32px; height: 9px;"></span></div>
              <div class="pill-btn"><span class="skel" style="width: 28px; height: 9px;"></span></div>
            </div>
          </div>

          <!-- Chat Scroll Stream -->
          <div class="chat-scroll-area">
            
            <!-- User Prompt Row -->
            <div class="msg-row-user">
              <div class="user-bubble-skel">
                <span class="skel" style="width: 320px; height: 11px;"></span>
                <span class="skel" style="width: 210px; height: 11px;"></span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; padding-right: 4px;">
                <span class="skel" style="width: 32px; height: 9px;"></span>
                <span class="skel" style="width: 12px; height: 12px; border-radius: 50%;"></span>
              </div>
            </div>

            <!-- Assistant Response Row -->
            <div class="msg-row-assistant">
              <div class="assistant-avatar-row">
                <span class="skel" style="width: 18px; height: 18px; border-radius: 4px;"></span>
                <span class="skel" style="width: 48px; height: 11px;"></span>
                <span class="skel" style="width: 40px; height: 9px; opacity: 0.5;"></span>
              </div>

              <!-- Thought Collapsible Accordion -->
              <div class="thought-card">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="skel skel-pulse" style="width: 12px; height: 12px; border-radius: 50%; background: #3b82f6;"></span>
                  <span class="skel" style="width: 140px; height: 10px;"></span>
                </div>
                <span class="skel" style="width: 10px; height: 10px;"></span>
              </div>

              <!-- Tool Execution Handoff Stack -->
              <div class="tool-execution-card">
                <div class="tool-header">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="skel" style="width: 12px; height: 12px;"></span>
                    <span class="skel" style="width: 110px; height: 11px;"></span>
                  </div>
                  <span class="skel" style="width: 44px; height: 9px;"></span>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="skel" style="width: 14px; height: 14px; border-radius: 3px;"></span>
                  <span class="skel" style="width: 240px; height: 10px;"></span>
                </div>
              </div>

              <!-- Assistant Markdown Text -->
              <div class="text-block-skel">
                <span class="skel" style="width: 92%; height: 11px;"></span>
                <span class="skel" style="width: 86%; height: 11px;"></span>
                <span class="skel" style="width: 64%; height: 11px;"></span>
              </div>

              <!-- Refined Code Block Card -->
              <div class="code-card-skel">
                <div class="code-card-header">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="skel" style="width: 12px; height: 12px;"></span>
                    <span class="skel" style="width: 160px; height: 10px;"></span>
                  </div>
                  <span class="skel" style="width: 36px; height: 9px;"></span>
                </div>
                <div class="code-card-body">
                  <div class="code-line">
                    <span class="line-num">1</span>
                    <span class="skel" style="width: 180px; height: 10px;"></span>
                  </div>
                  <div class="code-line">
                    <span class="line-num">2</span>
                    <span class="skel" style="width: 240px; height: 10px;"></span>
                  </div>
                  <div class="code-line">
                    <span class="line-num">3</span>
                    <span class="skel" style="width: 140px; height: 10px;"></span>
                  </div>
                  <div class="code-line">
                    <span class="line-num">4</span>
                    <span class="skel" style="width: 310px; height: 10px;"></span>
                  </div>
                </div>
              </div>

            </div>

          </div>

          <!-- FLOATING CHAT COMPOSER PANEL -->
          <div class="composer-container">
            <div class="composer-input-row">
              <span class="skel" style="width: 14px; height: 14px;"></span>
              <span class="skel" style="width: 280px; height: 12px;"></span>
            </div>

            <div class="composer-toolbar">
              <div class="toolbar-left-chips">
                <div class="chip-skel">
                  <span class="skel" style="width: 10px; height: 10px; border-radius: 50%;"></span>
                  <span class="skel" style="width: 95px; height: 9px;"></span>
                </div>
                <div class="chip-skel">
                  <span class="skel" style="width: 10px; height: 10px;"></span>
                  <span class="skel" style="width: 75px; height: 9px;"></span>
                </div>
                <div class="chip-skel">
                  <span class="skel" style="width: 10px; height: 10px;"></span>
                  <span class="skel" style="width: 40px; height: 9px;"></span>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="skel" style="width: 55px; height: 9px;"></span>
                <div class="send-btn-skel skel"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- ─── INSPECTION & DIFF PANE (45%) ─── -->
        <section class="diff-pane">
          <!-- Diff Toolbar -->
          <div class="diff-toolbar">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="source-seg">
                <div class="seg-btn"><span class="skel" style="width: 55px; height: 9px;"></span></div>
                <div class="seg-btn"><span class="skel" style="width: 60px; height: 9px; opacity: 0.5;"></span></div>
              </div>
              <span class="skel" style="width: 140px; height: 10px;"></span>
            </div>

            <div class="diff-meta">
              <span class="skel" style="width: 28px; height: 16px; border-radius: 4px; background: rgba(34, 197, 94, 0.15);"></span>
              <span class="skel" style="width: 28px; height: 16px; border-radius: 4px; background: rgba(239, 68, 68, 0.15);"></span>
              <div class="icon-btn-skel skel" style="width: 24px; height: 24px;"></div>
            </div>
          </div>

          <!-- Diff Body (Tree + Code Viewer) -->
          <div class="diff-content-body">
            <!-- File Tree Sidebar -->
            <div class="file-tree-sidebar">
              <div class="file-tree-item active">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="skel" style="width: 12px; height: 12px;"></span>
                  <span class="skel" style="width: 90px; height: 10px;"></span>
                </div>
                <div class="status-badge status-m">M</div>
              </div>

              <div class="file-tree-item">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="skel" style="width: 12px; height: 12px;"></span>
                  <span class="skel" style="width: 75px; height: 10px;"></span>
                </div>
                <div class="status-badge status-a">A</div>
              </div>

              <div class="file-tree-item">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="skel" style="width: 12px; height: 12px;"></span>
                  <span class="skel" style="width: 105px; height: 10px;"></span>
                </div>
                <div class="status-badge status-m">M</div>
              </div>

              <div class="file-tree-item">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="skel" style="width: 12px; height: 12px;"></span>
                  <span class="skel" style="width: 65px; height: 10px;"></span>
                </div>
                <div class="status-badge status-d">D</div>
              </div>
            </div>

            <!-- Code Diff Viewer -->
            <div class="diff-viewer">
              <div class="diff-chunk-header">
                <span class="skel" style="width: 12px; height: 12px;"></span>
                <span class="skel" style="width: 160px; height: 9px;"></span>
              </div>

              <!-- Diff Code Lines -->
              <div class="diff-line">
                <span class="diff-line-num">120</span>
                <span class="diff-marker"></span>
                <span class="skel" style="width: 210px; height: 10px;"></span>
              </div>

              <div class="diff-line">
                <span class="diff-line-num">121</span>
                <span class="diff-marker"></span>
                <span class="skel" style="width: 160px; height: 10px;"></span>
              </div>

              <!-- Deletion Line -->
              <div class="diff-line del">
                <span class="diff-line-num">122</span>
                <span class="diff-marker del">-</span>
                <span class="skel" style="width: 280px; height: 10px;"></span>
              </div>

              <!-- Addition Lines -->
              <div class="diff-line add">
                <span class="diff-line-num">122</span>
                <span class="diff-marker add">+</span>
                <span class="skel" style="width: 340px; height: 10px;"></span>
              </div>

              <div class="diff-line add">
                <span class="diff-line-num">123</span>
                <span class="diff-marker add">+</span>
                <span class="skel" style="width: 290px; height: 10px;"></span>
              </div>

              <div class="diff-line add">
                <span class="diff-line-num">124</span>
                <span class="diff-marker add">+</span>
                <span class="skel" style="width: 190px; height: 10px;"></span>
              </div>

              <div class="diff-line">
                <span class="diff-line-num">125</span>
                <span class="diff-marker"></span>
                <span class="skel" style="width: 220px; height: 10px;"></span>
              </div>

              <div class="diff-line">
                <span class="diff-line-num">126</span>
                <span class="diff-marker"></span>
                <span class="skel" style="width: 170px; height: 10px;"></span>
              </div>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>
</body>
</html>
