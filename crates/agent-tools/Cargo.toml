[package]
name = "agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
conex-diff = { path = "../conex-diff" }
conex-fs = { path = "../conex-fs" }
conex-sandbox = { path = "../conex-sandbox" }
conex-search = { path = "../conex-search" }
conex-types = { path = "../conex-types" }
# now_iso_utc 真源（纯 std）
conex-shared = { path = "../conex-shared" }
# S1（TOOLS-01 §3.1）：流式工具输出协议——ToolStream 的 Stream trait 与
# 构造助手（futures_util 为 workspace 既有依赖，复用不新增版本）
futures-util = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# PE-07 T07.6：锁中毒恢复路径错误日志（复用 workspace 既有依赖，非新外部依赖）
tracing = { workspace = true }

[dev-dependencies]
conex-test-utils = { path = "../conex-test-utils" }
# B1-3 毒化测日志捕获（LogCapture + with_capture 同形复制，对齐
# crates/session-loop/tests/observability.rs：15-61；tracing-subscriber 为
# workspace 既有依赖，零新 crate / 零 lockfile 变化）
tracing-subscriber = { workspace = true }
# I3-S7（C4 连续回退计数）：持久化链路集成测试（revert_guard 的
# SessionMetaRevertStore 经 session_meta 落库 + 重启恢复断言）；
# 生产代码保持叶子依赖（不引用 conex-db），接线在引擎侧完成。
conex-db = { path = "../conex-db" }
# 测试所需 feature（macros/rt/process/time）已由 workspace 最小集覆盖（PE-10 T10.3）
tokio = { workspace = true }

# 测试夹具：MCP 假 server（stdio JSON-RPC 回显），仅供 tests/mcp_bridge.rs 经
# CARGO_BIN_EXE_mcp_fake_server 启动；只用 std，不引入任何依赖。
[[bin]]
name = "mcp-fake-server"
path = "tests/fixtures/mcp_fake_server.rs"
