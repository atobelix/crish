[package]
name = "conex-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { workspace = true }
# G5 清理（2026-08-03）后新增引用（浏览器协同 G-4 收尾）：serde 本体原无引用
# （仅 serde_json 使用，cargo machete 实证）；imported.rs 行类型需直通 Tauri IPC
# （03-方案 §2.3），新增真实引用，属合理新增（workspace 既有声明，零新增版本面）
serde = { workspace = true }
serde_json = { workspace = true }
# T-16：blocks 模块缺表降级告警（R12/P2-1，tracing::warn!；workspace 既有依赖）
tracing = { workspace = true }
conex-types = { path = "../conex-types" }
# I6-M11 C5：探索类文档配额存储实现 agent-tools 的 ExploreDocsQuotaStore
# 契约（explore_quota.rs:96-106）。环说明：agent-tools 在 dev-dependencies
# 引用 conex-db（revert_guard 持久化集成测试）——Cargo 允许含 dev-dependency
# 的依赖环（agent-tools 侧为 dev 边，仅测试构建存在），生产构建无环。
agent-tools = { path = "../agent-tools" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Criterion 基准（PE-09 T09.7：db_write 写放大，仅 dev-dependency）
criterion = { workspace = true }

[[bench]]
name = "db_write"
harness = false
