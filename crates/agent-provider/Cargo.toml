[package]
name = "agent-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
conex-types = { path = "../conex-types" }
# T-34（00-plan §8.2 / R-J）：clean_output 清洗管线在 wire 序列化面统一
# 应用（to_chat_messages 投影）；conex-compaction 仅依赖 conex-types +
# serde_json（均已在依赖树），无环（agent-provider 不被其反向依赖）
conex-compaction = { path = "../conex-compaction" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
indexmap = { workspace = true }
# test-util：重试器测试用 tokio::time::pause/advance 推进时钟（B2.7）
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# 测试基础设施域（T11.7）：TimePauseGuard 虚拟时间护栏（Q41 时间确定性）
conex-test-utils = { path = "../conex-test-utils" }
# rt-multi-thread：集成测试（abort/classify/retry 等）使用 #[tokio::test(flavor = "multi_thread")]
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Criterion 基准（PE-09 T09.7：sse_parse 吞吐，仅 dev-dependency）
criterion = { workspace = true }

[[bench]]
name = "sse_parse"
harness = false

# DPAPI 凭据加密（B2.2）：windows-sys 0.61 已随 Tauri 壳进入 Cargo.lock（0.61.2），
# 此处仅补 feature 声明，不新增任何新 crate 到依赖树。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
