[package]
name = "agent-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
conex-types = { path = "../conex-types" }
serde = { workspace = true }
serde_json = { workspace = true }
# test-util：重试器测试用 tokio::time::pause/advance 推进时钟（B2.7）
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# rt-multi-thread：集成测试（abort/classify/retry 等）用 #[tokio::test(flavor = "multi_thread")]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# DPAPI 凭据加密（B2.2）：windows-sys 0.61 已随 Tauri 壳进入 Cargo.lock（0.61.2），
# 此处仅补 feature 声明，不新增任何新 crate 到依赖树。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
