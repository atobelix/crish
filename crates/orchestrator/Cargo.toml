[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# test-support：仅测试/基准构建启用，导出 persist::InMemoryStore 测试替身
# （生产 [dependencies] 一律不启用；消费方只能在 [dev-dependencies] 里开）
test-support = []

[dependencies]
# G5 清理（2026-08-03）：agent-tools 无任何引用（run/events/persist/session/restore
# 均为编排逻辑，工具执行未接线，cargo machete 实证）；I5-M6（C6 依赖图调度器）
# 按「后续工具执行接线时按需加回」约定加回：flow_graph.rs 复用 RecursionGuard
# （check_recursion_guard / DEFAULT_RECURSION_GUARD）做并发预算判定，并经
# SubagentSpawner 契约启动流程节点（agent-tools 为叶子 crate，无循环依赖）。
agent-tools = { path = "../agent-tools" }
conex-agents = { path = "../conex-agents" }
async-trait = { workspace = true }
conex-db = { path = "../conex-db" }
conex-types = { path = "../conex-types" }
# now_iso_utc 真源（纯 std；旧路径 crate::now_iso_utc re-export）
conex-shared = { path = "../conex-shared" }
serde = { workspace = true }
serde_json = { workspace = true }
session-loop = { path = "../session-loop" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 本 crate 的 tests/*.rs 集成测试与 benches 直接使用 persist::InMemoryStore
# 测试替身：以自身 dev-dependency 启用 test-support（仅测试/基准构建图生效）
orchestrator = { path = ".", features = ["test-support"] }
# rt-multi-thread：persist.rs 测试用 tokio::runtime::Runtime::new（PE-10 T10.3）
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Criterion 基准（PE-09 T09.7：event_chain，仅 dev-dependency）
criterion = { workspace = true }
# flow_scheduler.rs 集成测试：TempWorkspace（RAII 临时库目录，重启恢复场景）
conex-test-utils = { path = "../conex-test-utils" }
# multi_agent.rs 端到端链路（I7-M12）：压缩环节经 conex-compaction
# CompactionEngine::compact_agent_messages 契约面（链路测试域消费）
conex-compaction = { path = "../conex-compaction" }
# DM-08（G-29）对账测试：crash_consistency.rs LogCapture warn 捕获
# （tracing::subscriber::set_default + fmt writer，对齐 observability.rs）
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }

[[bench]]
name = "event_chain"
harness = false
# bench 使用 InMemoryStore 测试替身（仅在 test-support 构建图内可用）
required-features = ["test-support"]
