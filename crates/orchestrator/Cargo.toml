[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# G5 清理（2026-08-03）：agent-tools 无任何引用（run/events/persist/session/restore
# 均为编排逻辑，工具执行未接线，cargo machete 实证）；后续工具执行接线时按需加回。
async-trait = { workspace = true }
conex-db = { path = "../conex-db" }
conex-types = { path = "../conex-types" }
serde = { workspace = true }
serde_json = { workspace = true }
session-loop = { path = "../session-loop" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# rt-multi-thread：persist.rs 测试用 tokio::runtime::Runtime::new（PE-10 T10.3）
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Criterion 基准（PE-09 T09.7：event_chain，仅 dev-dependency）
criterion = { workspace = true }

[[bench]]
name = "event_chain"
harness = false
