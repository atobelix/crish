[package]
name = "conex-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
# env-filter feature is required for tracing_subscriber::EnvFilter; the workspace
# baseline declares tracing-subscriber without features, so enable it here.
# fmt feature: subscriber.rs 用 tracing_subscriber::fmt()（with_writer stderr + MakeWriterExt），
# 缺 fmt feature 时 io::Stderr 不实现 MakeWriter（编译报 E0599）。
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# G5 清理（2026-08-03）：serde 本体无引用（仅 serde_json::json! 使用，cargo machete 实证）
serde_json = { workspace = true }
# M-REDACT 打码铁律（D5 §6.3，R1-10）：redact.rs 的 sha256 前缀 12 hex 需要
# sha2/hex——均为 workspace 既有声明（auth.rs / conex-fs 先例），
# conex-telemetry 仍保持 leaf-level（不引入更高层 crate）
sha2 = { workspace = true }
hex = { workspace = true }
# CrishErrorPayload / CrishErrorCategory 来自 conex-types（ROUND-10-rust.md §3.2）；
# conex-shared 提供日志日期键与崩溃时间戳的时间真源。两者均为内部叶子依赖。
conex-types = { path = "../conex-types" }
# 多端设备协议（TY-P5）：redact.rs 的 PairCode 打码规则与设备配对码同源
conex-device-protocol = { path = "../conex-device-protocol" }
# 时间真源（X-03）：公历换算与当前毫秒统一走 conex_shared::time，禁止本地副本
conex-shared = { path = "../conex-shared" }
