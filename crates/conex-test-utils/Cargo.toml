[package]
name = "conex-test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# 域类型叶子 crate：断言助手按 AgentEvent/AgentMessage 签名（T11.7.1，
# 仅依赖 conex-types，不依赖 session-loop/orchestrator 等业务 crate）
conex-types = { path = "../conex-types" }
serde = { workspace = true }
serde_json = { workspace = true }
# TimePauseGuard（tokio::time::pause/advance）需要 test-util feature；
# 本 crate 只被各业务 crate 以 dev-dependency 引用，不会进生产构建
tokio = { workspace = true, features = ["test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
