[package]
name = "session-loop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
agent-tools = { path = "../agent-tools" }
# T-ESC-02（脚本逃逸追踪判定面）：判定器消费 conex-fs::watch 的事件形状
# （FileChangeEvent，T-ESC-01 数据面产物）；依赖链无环（conex-fs 仅依赖
# conex-types，agent-tools → conex-fs 已存在）
conex-fs = { path = "../conex-fs" }
# T-33（R4）：预算钳制 + 预检触发内联调用 CompactionEngine（P4 §3.4.1
# 核心决策——run 循环内直接依赖 conex-compaction，不走 core_compact_messages
# IPC 绕行）；conex-compaction 仅依赖 conex-types + serde_json，无环。
conex-compaction = { path = "../conex-compaction" }
conex-types = { path = "../conex-types" }
# now_iso_utc / civil_from_days / unix_millis 真源（纯 std）
conex-shared = { path = "../conex-shared" }
# T-36（R5）：缓存测量跟踪器消费 conex-telemetry 的 cache 纯函数模块
# （P5 §3.1.2 落点裁决：session-loop 引 conex-telemetry，其叶子约束不破——
# 该 crate 仅依赖 conex-types；A3 §7.1 登记本依赖为计划内唯一新增授权）
conex-telemetry = { path = "../conex-telemetry" }
futures = "0.3"
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 测试基础设施域（T11.7）：断言助手 + TestClock 虚拟时间护栏
conex-test-utils = { path = "../conex-test-utils" }
# 测试所需 feature（macros/rt/time）已由 workspace 最小集覆盖（PE-10 T10.3）；
# test-util 供 TimePauseGuard（tokio::time::pause/advance，Q41 时间确定性）；
# rt-multi-thread 供基准/集成测试的 Runtime::new（tool_batch 基准）
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
# 日志捕获测试（PE-04 T04.2）
tracing-subscriber = { workspace = true }
# Criterion 基准（PE-09 T09.7：request_build / tool_batch，仅 dev-dependency）
criterion = { workspace = true }

[[bench]]
name = "request_build"
harness = false

[[bench]]
name = "tool_batch"
harness = false
